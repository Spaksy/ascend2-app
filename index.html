/* ASCEND v2 — Coffres : LE canal unique de récompense (données pures ; Phase 1.2, refondu
   Phase 1.4). Arbitrage Leo (Phase 1.4) : le MATÉRIAU du coffre = le NIVEAU DE RARETÉ de
   l'objet qu'il contient (échelle à 6, cards.js). Plus le matériau est précieux, plus le
   coffre est rare à obtenir. La SOURCE de l'effort (habitude ? quête ? objectif ?) n'est
   plus portée par le matériau : elle est dite par le `sourceLabel` de chaque coffre.

   | matériau      | rareté de l'objet | produit par (Phase) |
   |---------------|-------------------|---------------------|
   | bois          | commun            | habitude 1.2 · quête courte 1.4 |
   | fer           | rare              | quête 1.4 |
   | or            | epique            | quête longue 1.4 · jalon 1.5 |
   | cristal       | legendaire        | objectif · niveau de bâtiment (2.2/4.1) — DÉCLARÉ |
   | obsidienne    | exceptionnel      | (source à venir) — DÉCLARÉ |
   | aube          | unique            | relique / collection complète — DÉCLARÉ |

   En Phase 1.4 seuls bois/fer/or sont PRODUITS (donc seuls eux ont une vignette CSS —
   zéro palette orpheline) ; cristal/obsidienne/aube sont déclarés pour la lisibilité du
   modèle et alimentés dans leur phase. Aucune logique : la liste + accès (dont rarityOf,
   consommé par le tirage derive.drawForChest). Apostrophes FR = ’ (U+2019). */
(function () {
  'use strict';

  // Ordre = rareté croissante (aligné sur cards.RARITIES). `rarity` fait le pont matériau→objet.
  var TYPES = [
    { id: 'bois',       label: 'Coffre de bois',       rarity: 'commun',       source: 'validation d’une habitude · quête courte' },
    { id: 'fer',        label: 'Coffre de fer',        rarity: 'rare',         source: 'quête minutée accomplie' },
    { id: 'or',         label: 'Coffre d’or',          rarity: 'epique',       source: 'quête longue · jalon franchi' },
    { id: 'cristal',    label: 'Coffre de cristal',    rarity: 'legendaire',   source: 'objectif accompli · niveau de bâtiment' },
    { id: 'obsidienne', label: 'Coffre d’obsidienne',  rarity: 'exceptionnel', source: 'récompense d’exception (à venir)' },
    { id: 'aube',       label: 'Coffre d’aube',        rarity: 'unique',       source: 'relique · collection complète (à venir)' }
  ];

  var byId = {};
  for (var i = 0; i < TYPES.length; i++) byId[TYPES[i].id] = TYPES[i];

  window.AscendChests = {
    list: TYPES,
    get: function (id) { return byId[id] || null; },
    has: function (id) { return Object.prototype.hasOwnProperty.call(byId, id); },
    // Rareté de l'objet qu'un coffre de ce matériau révèle (le pont consommé par le tirage).
    // Matériau inconnu (save bricolée) → 'commun' (repli serein, jamais de crash au tirage).
    rarityOf: function (id) { return byId[id] ? byId[id].rarity : 'commun'; }
  };
})();

/* ASCEND v2 — Pools d'objets par domaine (données pures, Phase 1.3).
   Le contenu qu'un coffre révèle vient d'ICI (tiré à l'OUVERTURE — la logique de tirage
   est dans derive.js ; ce fichier ne fait que déclarer le catalogue + le résoudre).

   Placeholders v0 : chaque objet = { id, domain, name, rarity }. Les histoires complètes
   (métadonnées narratives, art) = Phase 6.1 ; ici, un nom évocateur suffit.

   Raretés (GDD §4.2) : commun · rare · epique · legendaire — la rareté reflète l'EFFORT
   réel, jamais la chance seule. En Phase 1.3 le Coffre de BOIS ne tire que des COMMUNS
   (1 objet commun du pool du domaine). Les objets de rareté supérieure sont DÉCLARÉS pour
   la lisibilité du modèle (comme chests.js déclare fer/or/légendaire) et seront tirés dans
   LEUR phase (fer=1.4, or/jalons=1.5, légendaire=2.2/4.1) — aucune palette/UI orpheline :
   seule la rareté « commun » est rendue en 1.3.

   Anti-doublon / anti-frustration (GDD §4.3) : le tirage pioche SANS REMISE dans le pool
   du domaine ; pool de communs épuisé → objet remplacé par une DÉCO GÉNÉRATIVE (déterministe,
   toujours embellissante). Ces décos ne sont pas dans le catalogue fixe : leur id encode
   tout (`gen_<domaine>_<n>`) et `resolve()` les reconstruit → rien de précieux n'est stocké
   qui puisse être dérivé (invariant d'intégrité). Aucune logique de tirage ici. */
(function () {
  'use strict';

  // Échelle des raretés (§4.2, étendue Phase 1.4 — arbitrage Leo : 6 niveaux). id → libellé
  // FR + `rank` (ordre CROISSANT, seule source de vérité de la valeur d'une rareté).
  // Chaque rareté a son COFFRE du même niveau (chests.js : matériau = rareté). En Phase 1.4
  // les quêtes ne PRODUISENT que commun·rare·epique (bois/fer/or) ; legendaire·exceptionnel·
  // unique sont DÉCLARÉS pour le modèle (comme chests.js déclare leurs coffres) et tirés dans
  // LEUR phase — d'où l'absence de palette rc-rarity pour eux ici (zéro palette orpheline).
  var RARITIES = [
    { id: 'commun',       label: 'Commun',       rank: 1 },
    { id: 'rare',         label: 'Rare',         rank: 2 },
    { id: 'epique',       label: 'Épique',       rank: 3 },
    { id: 'legendaire',   label: 'Légendaire',   rank: 4 },
    { id: 'exceptionnel', label: 'Exceptionnel', rank: 5 },
    { id: 'unique',       label: 'Unique',       rank: 6 }
  ];
  var rarityById = {};
  for (var r = 0; r < RARITIES.length; r++) rarityById[RARITIES[r].id] = RARITIES[r];

  // Un POOL par domaine (ids des 5 domaines MVP — domains.js). Apostrophes FR = ’ (U+2019).
  // 6 communs par domaine (le vivier tiré en 1.3) + quelques objets de rareté supérieure
  // déclarés pour le modèle (tirés dans leur phase). Ids GLOBALEMENT uniques (préfixe domaine).
  var POOLS = {
    physique: [
      { id: 'phys_c1', name: 'Galet lisse',        rarity: 'commun' },
      { id: 'phys_c2', name: 'Corde à sauter',     rarity: 'commun' },
      { id: 'phys_c3', name: 'Gourde de voyage',   rarity: 'commun' },
      { id: 'phys_c4', name: 'Ruban de course',    rarity: 'commun' },
      { id: 'phys_c5', name: 'Caillou de sommet',  rarity: 'commun' },
      { id: 'phys_c6', name: 'Brassard usé',       rarity: 'commun' },
      { id: 'phys_r1', name: 'Médaille de bronze', rarity: 'rare' },
      { id: 'phys_e1', name: 'Flamme du marathon', rarity: 'epique' },
      { id: 'phys_l1', name: 'Atlas',              rarity: 'legendaire' }
    ],
    mental: [
      { id: 'ment_c1', name: 'Bille d’apaisement', rarity: 'commun' },
      { id: 'ment_c2', name: 'Carnet de pensées',  rarity: 'commun' },
      { id: 'ment_c3', name: 'Bougie douce',       rarity: 'commun' },
      { id: 'ment_c4', name: 'Galet du calme',     rarity: 'commun' },
      { id: 'ment_c5', name: 'Plume légère',       rarity: 'commun' },
      { id: 'ment_c6', name: 'Sablier de pause',   rarity: 'commun' },
      { id: 'ment_r1', name: 'Clé de sérénité',    rarity: 'rare' },
      { id: 'ment_e1', name: 'Phare intérieur',    rarity: 'epique' }
    ],
    connaissances: [
      { id: 'conn_c1', name: 'Marque-page corné',      rarity: 'commun' },
      { id: 'conn_c2', name: 'Bougie de lecture',      rarity: 'commun' },
      { id: 'conn_c3', name: 'Encrier séché',          rarity: 'commun' },
      { id: 'conn_c4', name: 'Feuille manuscrite',     rarity: 'commun' },
      { id: 'conn_c5', name: 'Loupe de poche',         rarity: 'commun' },
      { id: 'conn_c6', name: 'Ticket de bibliothèque', rarity: 'commun' },
      { id: 'conn_r1', name: 'Parchemin ancien',       rarity: 'rare' },
      { id: 'conn_e1', name: 'La Bibliothèque Éternelle', rarity: 'epique' }
    ],
    creativite: [
      { id: 'crea_c1', name: 'Crayon mâché',      rarity: 'commun' },
      { id: 'crea_c2', name: 'Éclat de couleur',  rarity: 'commun' },
      { id: 'crea_c3', name: 'Bouton dépareillé', rarity: 'commun' },
      { id: 'crea_c4', name: 'Bille de verre',    rarity: 'commun' },
      { id: 'crea_c5', name: 'Bout de ficelle',   rarity: 'commun' },
      { id: 'crea_c6', name: 'Pastel usé',        rarity: 'commun' },
      { id: 'crea_r1', name: 'Pinceau doré',      rarity: 'rare' },
      { id: 'crea_e1', name: 'Palette du maître', rarity: 'epique' }
    ],
    bienetre: [
      { id: 'bien_c1', name: 'Galet tiède',      rarity: 'commun' },
      { id: 'bien_c2', name: 'Brin de lavande',  rarity: 'commun' },
      { id: 'bien_c3', name: 'Tasse fumante',    rarity: 'commun' },
      { id: 'bien_c4', name: 'Coussin moelleux', rarity: 'commun' },
      { id: 'bien_c5', name: 'Feuille de menthe',rarity: 'commun' },
      { id: 'bien_c6', name: 'Plume d’oreiller', rarity: 'commun' },
      { id: 'bien_r1', name: 'Fleur de quiétude',rarity: 'rare' },
      { id: 'bien_e1', name: 'Source paisible',  rarity: 'epique' }
    ]
  };

  // Index plat id → objet enrichi de son domaine (le domaine vient de la clé de POOLS,
  // pas dupliqué dans chaque record). `byRarityDom[domain][rarity]` = le vivier d'un tirage
  // (le tirage pioche SANS REMISE dans le vivier de la rareté du coffre — derive.js).
  var byId = {};
  var byRarityDom = {};
  for (var dom in POOLS) {
    if (!POOLS.hasOwnProperty(dom)) continue;
    byRarityDom[dom] = {};
    var arr = POOLS[dom];
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      var card = { id: it.id, domain: dom, name: it.name, rarity: it.rarity };
      byId[card.id] = card;
      (byRarityDom[dom][card.rarity] || (byRarityDom[dom][card.rarity] = [])).push(card);
    }
  }

  // Décos génératives (déco quand le pool de communs d'un domaine est épuisé, §4.3).
  // Toujours embellissantes ; nom déterministe du seul id (aucune donnée stockée).
  var GEN_FLAVORS = [
    'Galet du rivage', 'Jeune pousse', 'Sentier de pierres',
    'Fleur des champs', 'Rocher moussu', 'Éclat de lumière'
  ];

  /* ------------------------------------------------ jalons d'habitude (Phase 1.5) */
  // Cartes-jalons UNIQUES et DÉTERMINISTES (GDD §5.3) : franchir un seuil de validations
  // GARANTIT sa carte-jalon — le hasard ne porte JAMAIS sur le mémorable. Chaque seuil →
  // un matériau de coffre (montée douce, arbitrage Leo : 10/25 or·épique · 50 cristal·
  // légendaire · 100 aube·unique) + une vertu. La carte PORTE la rareté du coffre (le pont
  // chests.rarityOf). Un coffre de jalon force sa carte via `chest.cardId` (derive.drawForChest).
  //
  // Id d'une carte-jalon = `mile_<domaine>_<habitId>_<seuil>` → UNIQUE par (habitude × seuil)
  // donc jamais de doublon dans l'inventaire. resolve() n'a besoin que du DOMAINE (préfixe,
  // sans underscore) et du SEUIL (suffixe numérique) : le nom/rareté se DÉRIVENT du seuil,
  // pur et stable même si l'habitude est supprimée. Le souvenir précis (habitude, date) vit
  // dans le sourceLabel du coffre, repris à l'ouverture (comme toute carte, §5.2).
  var MILESTONES = [
    { threshold: 10,  tier: 'or',      virtue: 'Constance' },
    { threshold: 25,  tier: 'or',      virtue: 'Persévérance' },
    { threshold: 50,  tier: 'cristal', virtue: 'Maîtrise' },
    { threshold: 100, tier: 'aube',    virtue: 'Légende' }
  ];
  var milestoneByThreshold = {};
  for (var mi = 0; mi < MILESTONES.length; mi++) milestoneByThreshold[MILESTONES[mi].threshold] = MILESTONES[mi];

  // Rareté d'un matériau de coffre (pont vers chests.js, chargé avant ce fichier). Repli
  // 'epique' si le module manquait (jamais en pratique) → aucun crash au rendu.
  function tierRarity(tier) {
    return (window.AscendChests && window.AscendChests.rarityOf) ? window.AscendChests.rarityOf(tier) : 'epique';
  }
  // Le jalon franchi À CE compteur (exactement un seuil ou aucun) : appelé après validation,
  // count === seuil ⇒ jalon atteint. Retourne le descripteur { threshold, tier, virtue } ou null.
  function milestoneAt(count) {
    return milestoneByThreshold[count] || null;
  }
  // Fabrique l'id de la carte-jalon d'une (habitude, seuil) — source unique de la convention d'id.
  function milestoneCardId(domain, habitId, threshold) {
    return 'mile_' + domain + '_' + habitId + '_' + threshold;
  }

  // Hash de chaîne déterministe (FNV-1a 32 bits) — sert au tirage (derive.js) ET au choix
  // de saveur générative. Pur, sans réseau, stable entre sessions.
  function hash(s) {
    s = '' + s;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function unknown(itemId) {
    return { id: itemId || '?', domain: '', name: 'Objet mystère', rarity: 'commun', generative: false, unknown: true };
  }

  // Résout un itemId (stocké minimal dans inventory) en objet affichable. Gère le catalogue
  // fixe ET les décos génératives (`gen_<domaine>_<n>`) ; itemId inconnu (save bricolée) →
  // repli serein (jamais de crash au rendu de la collection).
  function resolve(itemId) {
    if (typeof itemId !== 'string' || !itemId) return unknown(itemId);
    if (byId[itemId]) return byId[itemId];
    if (itemId.indexOf('gen_') === 0) {
      var parts = itemId.split('_');            // ['gen', <domaine>, <n>]
      var domain = parts[1] || '';
      var flavor = GEN_FLAVORS[hash(itemId) % GEN_FLAVORS.length];
      return { id: itemId, domain: domain, name: flavor, rarity: 'commun', generative: true };
    }
    if (itemId.indexOf('mile_') === 0) {        // carte-jalon : mile_<domaine>_<habitId...>_<seuil>
      var mp = itemId.split('_');
      var mdomain = mp[1] || '';
      var th = parseInt(mp[mp.length - 1], 10); // le seuil = suffixe numérique (habitId au milieu ignoré)
      var ms = milestoneByThreshold[th];
      if (ms) {
        return {
          id: itemId, domain: mdomain,
          name: th + 'ᵉ — ' + ms.virtue,         // ex. « 10ᵉ — Constance » (déterministe)
          rarity: tierRarity(ms.tier), milestone: true, threshold: th
        };
      }
      return unknown(itemId);
    }
    return unknown(itemId);
  }

  // Fabrique l'id d'une déco générative (le n-ième déjà généré pour ce domaine → id unique)
  // et le résout. Utilisé par le tirage quand le pool de communs est vide.
  function makeGenerative(domain, n) {
    return resolve('gen_' + domain + '_' + (n | 0));
  }

  window.AscendCards = {
    pools: POOLS,
    rarities: RARITIES,
    rarityLabel: function (id) { return rarityById[id] ? rarityById[id].label : 'Commun'; },
    rarityRank: function (id) { return rarityById[id] ? rarityById[id].rank : 1; },
    // Vivier d'un domaine pour une rareté donnée (copie défensive). Vide si le domaine n'a
    // pas (encore) d'objet de cette rareté — le tirage retombera alors sur une déco générative.
    byDomainRarity: function (domain, rarity) {
      return (byRarityDom[domain] && byRarityDom[domain][rarity]) ? byRarityDom[domain][rarity].slice() : [];
    },
    // Conservé (Phase 1.3) : le vivier commun d'un domaine = cas particulier de byDomainRarity.
    commonsByDomain: function (domain) { return this.byDomainRarity(domain, 'commun'); },
    get: resolve,
    resolve: resolve,
    makeGenerative: makeGenerative,
    // Jalons d'habitude (Phase 1.5) : catalogue + résolution déterministe des cartes-jalons.
    milestones: MILESTONES,
    milestoneAt: milestoneAt,
    milestoneCardId: milestoneCardId,
    hash: hash
  };
})();

/* ASCEND v2 — Dérivé (Phase 1.1).
   INVARIANT structurel : tout ce qui est précieux et calculable se DÉRIVE ici
   depuis history/inventory — jamais stocké (un save édité à la main ne peut pas
   s'inventer un compteur). Ce fichier grandira (élan, niveaux, pools, jalons) ;
   la Phase 1.1 n'a besoin que du compteur d'habitude et du « déjà validée ce jour ? ».
   Fonctions PURES : elles lisent l'état passé, ne mutent rien. */
(function () {
  'use strict';

  var cards = window.AscendCards;
  var chestTypes = window.AscendChests;
  var domains = window.AscendDomains;

  function historyOf(state) {
    return (state && Array.isArray(state.history)) ? state.history : [];
  }
  function inventoryOf(state) {
    return (state && Array.isArray(state.inventory)) ? state.inventory : [];
  }

  // Compteur cumulatif d'une habitude = nombre d'entrées d'historique la référençant.
  // Jamais perdu, jamais stocké : c'est le remplaçant SAIN du streak (on compte ce qui
  // a été FAIT, pas les jours consécutifs — GDD §3.1).
  function habitCount(state, habitId) {
    var hist = historyOf(state), n = 0;
    for (var i = 0; i < hist.length; i++) {
      var e = hist[i];
      if (e && e.kind === 'habit' && e.refId === habitId) n++;
    }
    return n;
  }

  // Prochain jalon d'habitude à partir d'un compteur cumulatif (Phase 1.5). DÉRIVÉ, jamais
  // stocké, jamais punitif : c'est une INVITATION (« Plus que N avant le jalon des S »), pas
  // une menace. Retourne { threshold, remaining } pour le plus petit seuil encore devant, ou
  // null si tous les jalons déclarés sont franchis (au-delà de 100 : aucune pression).
  function nextMilestone(count) {
    var ms = cards.milestones;
    for (var i = 0; i < ms.length; i++) {
      if (ms[i].threshold > count) return { threshold: ms[i].threshold, remaining: ms[i].threshold - count };
    }
    return null;
  }

  // Une habitude est-elle déjà validée pour le jour civil `day` (clé todayKey()) ?
  // Garde d'or : on ne valide JAMAIS deux fois la même habitude le même jour civil.
  function isHabitValidatedOn(state, habitId, day) {
    if (!day) return false;
    var hist = historyOf(state);
    for (var i = 0; i < hist.length; i++) {
      var e = hist[i];
      if (e && e.kind === 'habit' && e.refId === habitId && e.day === day) return true;
    }
    return false;
  }

  /* ------------------------------------------------ tirage de coffre (Phase 1.3) */
  // Le contenu d'un coffre est DÉRIVÉ à l'ouverture, jamais stocké à l'obtention (TDD §4,
  // GDD §4.3). C'est une fonction PURE de (state, chest) : re-calculable, IDEMPOTENTE tant
  // que le coffre n'est pas ouvert (même chestId → même objet), mais FIGÉE seulement au
  // moment où actions.openChest écrit l'entrée d'inventory.
  //
  // Seed = hash(createdAt + chestId) → indépendante de l'horloge, stable entre sessions.
  // Sans remise : on retire du pool du domaine les objets DÉJÀ possédés (aucun doublon).
  // Pool de communs épuisé → déco générative déterministe (n = nombre de génératifs déjà
  // possédés dans ce domaine → id unique). En 1.3 : Coffre de bois → 1 COMMUN.

  function ownedItemIds(state) {
    var inv = inventoryOf(state), set = {};
    for (var i = 0; i < inv.length; i++) {
      var e = inv[i];
      if (e && typeof e.itemId === 'string') set[e.itemId] = true;
    }
    return set;
  }

  // Combien de décos génératives ce domaine a-t-il déjà produites (dans inventory) ?
  // Sert à donner à la prochaine un id unique (gen_<domaine>_<n>).
  function generativeCountInDomain(state, domain) {
    var inv = inventoryOf(state), n = 0;
    for (var i = 0; i < inv.length; i++) {
      var e = inv[i];
      if (!e || typeof e.itemId !== 'string') continue;
      var it = cards.resolve(e.itemId);
      if (it && it.generative && it.domain === domain) n++;
    }
    return n;
  }

  // Le contenu tiré = un objet de la RARETÉ du coffre (matériau → rareté, chests.rarityOf).
  // En 1.3 le bois donnait un commun ; en 1.4 le fer donne un rare, l'or un épique — MÊME
  // fonction (généralisée), pas de nouveau canal. Sans remise dans le vivier de cette rareté ;
  // vivier épuisé (pools v0 : 1 rare / 1 épique par domaine) → déco générative (GDD §4.3).
  function drawForChest(state, chest) {
    if (!chest) return null;
    // Coffre de JALON (Phase 1.5) : il porte une carte-jalon GARANTIE (cardId déterministe).
    // Le hasard ne porte JAMAIS sur le mémorable (GDD §5.3) → on force cette carte, pas de tirage.
    if (chest.cardId) return cards.resolve(chest.cardId);
    if (!chest.domain) return null;
    var rarity = chestTypes.rarityOf(chest.type);
    var seed = cards.hash((state && state.createdAt ? state.createdAt : '') + '|' + chest.id);
    var owned = ownedItemIds(state);
    var pool = cards.byDomainRarity(chest.domain, rarity).filter(function (c) { return !owned[c.id]; });
    if (pool.length) return pool[seed % pool.length];
    // Vivier épuisé → déco générative (embellit toujours l'île, rareté commune, GDD §4.3).
    return cards.makeGenerative(chest.domain, generativeCountInDomain(state, chest.domain));
  }

  /* -------------------------------------------- quêtes minutées (Phase 1.4) */
  // Une quête active est-elle EXPLOITABLE ? (obj?, non type-validé en profondeur au chargement
  // — une save bricolée peut porter un activeQuest incohérent → on le traite comme « aucune »
  // pour ne jamais bloquer le boot ni fausser le chrono.)
  function isValidActiveQuest(aq) {
    return !!(aq && typeof aq.id === 'string' &&
      domains.has(aq.domain) &&
      typeof aq.minutes === 'number' && isFinite(aq.minutes) && aq.minutes > 0 &&
      typeof aq.startedAt === 'number' && isFinite(aq.startedAt) && aq.startedAt > 0);
  }

  // Élan d'une quête selon sa durée (GDD §6.2 : quête = +2 à +4). Nourrit l'historique dès
  // maintenant (les niveaux de bâtiment le consommeront en Phase 2.2). Court/moyen/long.
  function questElan(minutes) {
    if (!(minutes > 0)) return 2;
    if (minutes < 15) return 2;
    if (minutes < 45) return 3;
    return 4;
  }

  // Progression d'une quête à l'instant `nowMs` (Date.now() passé par l'appelant → fonction
  // PURE et testable). Le chrono est RÉEL : elapsed = maintenant − startedAt (persistant,
  // repris après reload — leçon v1 P0-7). Gate NON punitif à 50 % ; « longue reprise »
  // automatiquement débloquée puisque elapsed croît avec l'horloge murale.
  function questProgress(aq, nowMs) {
    var targetMs = aq.minutes * 60000;
    var elapsedMs = Math.max(0, nowMs - aq.startedAt);
    var gateMs = targetMs * 0.5;
    var ratio = targetMs > 0 ? elapsedMs / targetMs : 1;   // 0→1+ vers la durée CIBLE (l'anneau)
    return {
      elapsedMs: elapsedMs,
      targetMs: targetMs,
      remainingToTargetMs: Math.max(0, targetMs - elapsedMs),
      remainingToGateMs: Math.max(0, gateMs - elapsedMs),
      progress: Math.max(0, Math.min(1, ratio)),           // borné pour l'anneau
      gateReached: elapsedMs >= gateMs                      // « J'ai fini » débloqué
    };
  }

  // Tables de PONDÉRATION du tier de coffre par durée (arbitrage : plus la quête est longue,
  // meilleures les probas — GDD §4.2 « la rareté reflète l'effort réel »). Quêtes plafonnées
  // à or/épique (arbitrage Leo) : jamais cristal+ ici. Poids sur 10000 (bois·fer·or cumulés).
  var TIER_WEIGHTS = {
    court: { bois: 8000, fer: 1800, or: 200 },   // < 15 min
    moyen: { bois: 5500, fer: 3500, or: 1000 },  // 15–44 min
    long:  { bois: 3500, fer: 4500, or: 2000 }   // ≥ 45 min
  };
  function durationBucket(minutes) {
    if (minutes < 15) return 'court';
    if (minutes < 45) return 'moyen';
    return 'long';
  }
  var PITY_N = 7; // arbitrage Leo : 1 coffre « rare ou mieux » (fer+) garanti tous les 7 (pity.ironSinceRare).

  /* ------------------------------------------ bâtiments & niveaux — élan (Phase 2.2) */
  // ÉLAN d'un domaine = somme pondérée des validations réelles, DÉRIVÉE de `history`
  // (JAMAIS stockée) : chaque entrée porte son propre `elan` — habitude +1, quête +2/+3/+4
  // (kind:'quest'), jalon +10 (kind:'milestone', câblé Phase 2.2). Il suffit donc de sommer
  // les entrées du domaine. Une save éditée à la main ne peut pas s'inventer d'élan : il
  // vient d'entrées datées de l'historique (invariant d'intégrité TDD §4).
  function domainElan(state, domain) {
    var hist = historyOf(state), sum = 0;
    for (var i = 0; i < hist.length; i++) {
      var e = hist[i];
      if (e && e.domain === domain && typeof e.elan === 'number' && isFinite(e.elan)) sum += e.elan;
    }
    return sum;
  }

  // Paliers de niveau (GDD §13, arbitrage Leo : Nv 2 à 12 d'élan, croissance ×1,6/niveau).
  // Coût d'un passage L→L+1 = 12·1,6^(L-1) ; SEUIL cumulé pour ATTEINDRE le niveau L (L ≥ 2)
  // = 12·(1,6^(L-1) − 1)/0,6. Paliers COURTS au début (Nv 2 atteignable en ~1 semaine active
  // — leçon directe de l'audit v1 : le 1er palier doit être visible), puis progressifs, jamais
  // un mur. Le niveau ne descend JAMAIS (l'history ne perd rien → l'élan est monotone).
  var ELAN_NV2 = 12, ELAN_GROWTH = 1.6, LEVEL_CAP = 99;
  function levelThreshold(level) {
    if (level <= 1) return 0;                 // niveau 1 = fondation posée (1er élan)
    return ELAN_NV2 * (Math.pow(ELAN_GROWTH, level - 1) - 1) / (ELAN_GROWTH - 1);
  }
  // NIVEAU d'un bâtiment à partir de son élan. 0 = parcelle dormante (aucun élan) ; 1 =
  // fondation posée ; 2+ via paliers. MONOTONE (l'élan ne décroît jamais → le niveau non plus).
  function levelFromElan(elan) {
    if (!(elan > 0)) return 0;
    var lvl = 1;
    while (lvl < LEVEL_CAP && elan >= levelThreshold(lvl + 1)) lvl++;
    return lvl;
  }
  function buildingLevel(state, domain) { return levelFromElan(domainElan(state, domain)); }

  // Vue complète d'un bâtiment pour l'UI (scène + liste) — DÉRIVÉE, jamais stockée.
  // { elan, level, nextAt, remaining } : remaining = élan restant avant le niveau suivant
  // (invitation non punitive dans la vue liste). Pour un domaine dormant (level 0), remaining
  // pointe vers le niveau 1 (le 1er élan) ; sinon vers le palier du niveau supérieur.
  function buildingInfo(state, domain) {
    var elan = domainElan(state, domain);
    var level = levelFromElan(elan);
    var nextAt = levelThreshold(level + 1);
    return {
      elan: elan,
      level: level,
      nextAt: nextAt,
      remaining: Math.max(0, Math.ceil(nextAt - elan))
    };
  }

  // Somme des niveaux de tous les domaines — pilote le recul GLOBAL de la brume (arbitrage
  // Leo : plus l'île mûrit, plus le voile s'éloigne). DÉRIVÉE de history (jamais stockée).
  function totalBuildingLevels(state) {
    var list = domains.list, sum = 0;
    for (var i = 0; i < list.length; i++) sum += buildingLevel(state, list[i].id);
    return sum;
  }

  // Tire le MATÉRIAU (= rareté) du coffre d'une quête accomplie. Décidé À L'ACCOMPLISSEMENT
  // (le coffre PORTE ensuite sa rareté, visible dans la pile — arbitrage Leo « un niveau de
  // coffre par niveau de rareté ») ; l'OBJET précis reste tiré à l'ouverture (drawForChest).
  // DÉTERMINISTE : seed = hash(createdAt + quest.id + startedAt). PITIÉ : si l'on a déjà eu
  // PITY_N−1 bois d'affilée, ce coffre est remonté à `fer` minimum (malchance bornée).
  // Retourne { tier, wouldResetPity } — pity effectivement écrit par actions au moment du push.
  function rollQuestChestTier(state, aq) {
    var w = TIER_WEIGHTS[durationBucket(aq.minutes)];
    var seed = cards.hash((state && state.createdAt ? state.createdAt : '') + '|tier|' + aq.id + '|' + aq.startedAt);
    var roll = seed % 10000;
    var tier = 'bois';
    if (roll < w.or) tier = 'or';
    else if (roll < w.or + w.fer) tier = 'fer';
    else tier = 'bois';
    var since = (state && state.pity && typeof state.pity.ironSinceRare === 'number') ? state.pity.ironSinceRare : 0;
    if (tier === 'bois' && since >= PITY_N - 1) tier = 'fer';   // pitié : rare garanti
    return { tier: tier, resetsPity: tier !== 'bois' };
  }

  window.AscendDerive = {
    habitCount: habitCount,
    nextMilestone: nextMilestone,
    isHabitValidatedOn: isHabitValidatedOn,
    drawForChest: drawForChest,
    isValidActiveQuest: isValidActiveQuest,
    questElan: questElan,
    questProgress: questProgress,
    rollQuestChestTier: rollQuestChestTier,
    PITY_N: PITY_N,
    // Bâtiments & niveaux (Phase 2.2) — tout DÉRIVÉ de history.
    domainElan: domainElan,
    levelThreshold: levelThreshold,
    levelFromElan: levelFromElan,
    buildingLevel: buildingLevel,
    buildingInfo: buildingInfo,
    totalBuildingLevels: totalBuildingLevels,
    ELAN_NV2: ELAN_NV2,
    ELAN_GROWTH: ELAN_GROWTH
  };
})();

/* ASCEND v2 — Actions (mutations métier, Phases 1.1 → 1.2).
   Seul endroit qui MUTE l'état (via AscendStore.set → persistance + notify).
   Phase 1.1 : CRUD habitude + validation du jour. Phase 1.2 : la validation d'habitude
   PRODUIT en plus un Coffre de bois (le canal de récompense, GDD §4.1) — poussé dans
   `chests` (non ouvert : l'ouverture = Phase 1.3). L'entrée d'historique datée reste la
   source de vérité dont tout le dérivé découle.

   Rappel modèle (TDD §4) : le record d'habitude est {id,title,domain,freq,createdAt}.
   On N'Y STOCKE PAS `count` (pourtant listé §4) : le compteur est DÉRIVÉ de history
   (AscendDerive.habitCount) — invariant d'intégrité, prime sur la liste indicative. */
(function () {
  'use strict';

  var store = window.AscendStore;
  var derive = window.AscendDerive;
  var domains = window.AscendDomains;
  var cards = window.AscendCards;

  function uid(prefix) {
    // Identifiant local unique (aucun réseau) : temps + aléa, base36 compact.
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function trim(s) { return (typeof s === 'string') ? s.replace(/^\s+|\s+$/g, '') : ''; }

  function findHabit(state, id) {
    var hs = state.habits || [];
    for (var i = 0; i < hs.length; i++) if (hs[i] && hs[i].id === id) return hs[i];
    return null;
  }

  /* ---------------------------------------- bâtiments & niveaux — élan (Phase 2.2) */
  // Pose la FONDATION du domaine (`buildings.<domain>.placed = true`) au 1er élan — SEUL
  // bool stocké, non destructif (le NIVEAU reste DÉRIVÉ de history, jamais stocké : TDD §4).
  // Idempotent : rien à faire si déjà posée. Écrit dans `patch.buildings` (copie défensive).
  function stampPlaced(st, domain, patch) {
    var b = (st.buildings && typeof st.buildings === 'object') ? st.buildings : {};
    if (b[domain] && b[domain].placed) return;
    var nb = {};
    for (var k in b) if (b.hasOwnProperty(k)) nb[k] = b[k];
    nb[domain] = { placed: true };
    patch.buildings = nb;
  }

  // Franchissement de niveau(x) : si l'élan du domaine passe d'un niveau à un supérieur,
  // pousse UN Coffre LÉGENDAIRE (cristal — GDD §6.2) PAR niveau franchi, dans `outChests`.
  // JAMAIS pour le niveau 1 (= simple pose de la fondation, pas une montée). Le coffre rejoint
  // « À découvrir » ; la cérémonie 1.3 est réutilisée à l'ouverture (canal coffre unique).
  // Retourne la liste des niveaux atteints [{level, domain}] pour le bandeau doux (célébration
  // SOBRE, non punitive). DÉTERMINISTE : le niveau vient de l'élan dérivé, pas du hasard.
  function pushLevelChests(st, domain, elanBefore, delta, day, outChests) {
    var before = derive.levelFromElan(elanBefore);
    var after = derive.levelFromElan(elanBefore + delta);
    var ups = [];
    var d = domains.get(domain);
    var label = d ? d.label : domain;
    for (var L = Math.max(2, before + 1); L <= after; L++) {
      outChests.push({
        id: uid('c'),
        type: 'cristal',                 // matériau légendaire (chests.js : rareté « legendaire »)
        domain: domain,
        sourceLabel: 'Niveau ' + L + ' de ton ' + label + ' — ton élan l’a fait grandir',
        day: day
      });
      ups.push({ level: L, domain: domain });
    }
    return ups;
  }

  // Crée une habitude. Retourne le record créé, ou null si invalide
  // (titre vide après trim, ou domaine hors des 5 domaines actifs).
  function createHabit(title, domain, freq) {
    var t = trim(title);
    if (!t || !domains.has(domain)) return null;
    var st = store.get();
    var habit = {
      id: uid('h'),
      title: t,
      domain: domain,
      freq: trim(freq),          // fréquence LIBRE (peut rester vide — GDD §3.1)
      createdAt: store.todayKey()
    };
    store.set({ habits: st.habits.concat([habit]) });
    return habit;
  }

  // Édite titre / domaine / fréquence d'une habitude. Ne touche NI id NI createdAt.
  // Un patch invalide (titre vidé, domaine inconnu) est simplement ignoré champ par champ.
  // Retourne true si l'habitude existait, false sinon.
  function editHabit(id, patch) {
    var st = store.get();
    if (!findHabit(st, id)) return false;
    patch = patch || {};
    var habits = st.habits.map(function (hb) {
      if (!hb || hb.id !== id) return hb;
      var next = { id: hb.id, title: hb.title, domain: hb.domain, freq: hb.freq, createdAt: hb.createdAt };
      if (typeof patch.title === 'string') { var tt = trim(patch.title); if (tt) next.title = tt; }
      if (domains.has(patch.domain)) next.domain = patch.domain;
      if (typeof patch.freq === 'string') next.freq = trim(patch.freq);
      return next;
    });
    store.set({ habits: habits });
    return true;
  }

  // Supprime le record d'habitude. On NE touche JAMAIS `history` : les entrées datées
  // restent (registre honnête de l'effort réel — invariant « rien de précieux dérivable
  // n'est détruit »). Une habitude supprimée n'est simplement plus affichée ni validable.
  // Retourne true si quelque chose a été retiré.
  function deleteHabit(id) {
    var st = store.get();
    var habits = st.habits.filter(function (hb) { return !(hb && hb.id === id); });
    if (habits.length === st.habits.length) return false;
    store.set({ habits: habits });
    return true;
  }

  // Valide une habitude pour AUJOURD'HUI. Garde d'or : jamais deux fois le même jour
  // civil pour la même habitude (s'appuie sur todayKey()/history via AscendDerive) —
  // donc jamais deux coffres pour la même habitude le même jour (le PUSH n'a lieu que
  // dans la branche « valide », après la garde). Alimente `history` (entrée datée,
  // elan +1 = poids habitude, GDD §6.2) ET `chests` (un Coffre de bois non ouvert,
  // avec son libellé de source — GDD §4.1 / §5.2). Une seule écriture (les deux clés
  // dans le même set → une save, une notification).
  // Retourne { ok, reason:'valide'|'deja'|'introuvable', count, chest } — count = cumul
  // dérivé ; chest = le coffre créé (ou undefined si non validé).
  function validateHabit(id) {
    var st = store.get();
    var habit = findHabit(st, id);
    if (!habit) return { ok: false, reason: 'introuvable', count: 0 };
    var day = store.todayKey();
    if (derive.isHabitValidatedOn(st, id, day)) {
      return { ok: false, reason: 'deja', count: derive.habitCount(st, id) };
    }
    var domain = habit.domain;
    var elanBefore = derive.domainElan(st, domain);   // élan du domaine AVANT cette validation
    var entry = { kind: 'habit', refId: id, domain: domain, day: day, elan: 1 };
    var newHistory = [entry];
    var delta = entry.elan;                             // élan ajouté par cette validation (≥ 1)
    var chest = {
      id: uid('c'),
      type: 'bois',
      domain: domain,
      sourceLabel: 'Obtenu en validant « ' + habit.title + ' »',
      day: day
    };
    var newChests = [chest];

    // Jalon d'habitude (Phase 1.5) — détecté ICI, au moment de la validation, APRÈS la garde
    // d'or (donc jamais deux fois le même seuil). Le cumul est DÉRIVÉ de history (jamais stocké) :
    // cette entrée ajoute exactement 1 → newCount = compteur d'avant + 1. Franchir un seuil pousse
    // EN PLUS du Coffre de bois un coffre de jalon (montée douce : or/or/cristal/aube), qui PORTE
    // sa carte-jalon garantie (cardId déterministe — le hasard ne touche jamais le mémorable, §5.3).
    var newCount = derive.habitCount(st, id) + 1;
    var ms = cards.milestoneAt(newCount);
    var milestone = null;
    if (ms) {
      var mileId = cards.milestoneCardId(domain, id, ms.threshold);
      newChests.push({
        id: uid('c'),
        type: ms.tier,
        domain: domain,
        sourceLabel: ms.threshold + 'ᵉ fois « ' + habit.title + ' » — un cap franchi',
        day: day,
        cardId: mileId                        // carte-jalon GARANTIE (forcée par derive.drawForChest)
      });
      // Élan de jalon (+10, GDD §6.2) CÂBLÉ dans l'élan de bâtiment (Phase 2.2) : le jalon
      // devient une entrée d'historique à part entière (kind:'milestone'), datée, comptée
      // dans domainElan — sans jamais entrer dans habitCount (qui ne compte que 'habit').
      newHistory.push({ kind: 'milestone', refId: mileId, domain: domain, day: day, elan: 10 });
      delta += 10;
      milestone = { threshold: ms.threshold, tier: ms.tier, virtue: ms.virtue };
    }

    // Bâtiment (Phase 2.2) : la validation fait-elle franchir un ou plusieurs paliers de niveau ?
    // (À APPELER avant de figer `newChests` : cette fonction y ajoute les coffres légendaires.)
    var levelUps = pushLevelChests(st, domain, elanBefore, delta, day, newChests);
    var patch = {
      history: st.history.concat(newHistory),
      chests: st.chests.concat(newChests)
    };
    stampPlaced(st, domain, patch);           // pose la fondation au 1er élan du domaine

    store.set(patch);
    return { ok: true, reason: 'valide', count: newCount, chest: chest, milestone: milestone, levelUps: levelUps };
  }

  function findChest(state, id) {
    var cs = state.chests || [];
    for (var i = 0; i < cs.length; i++) if (cs[i] && cs[i].id === id) return cs[i];
    return null;
  }

  /* Phase 4.2b — le PLACEMENT sur l'île (2.3 : putOnIsland / takeOffIsland) a été RETIRÉ sur
     arbitrage de Leo : les objets se disposeront dans le MUSÉE (M3.3), pas sur l'île. Aucune
     mutation ne touche donc plus `placements` ; les positions déjà enregistrées restent dans
     la save, intactes (non destructif — voir state.js). */

  // Ouvre un coffre : c'est ICI que le tirage (dérivé, idempotent tant que non ouvert) est
  // FIGÉ en une entrée d'inventory (GDD §4.3, TDD §4). Le coffre quitte la pile ; l'objet
  // rejoint la collection avec ses métadonnées-souvenir (§5.2) : date + source reprise du
  // coffre, photo/note à venir (Phase 7). Une seule écriture (chests + inventory).
  // Idempotent/robuste : coffre introuvable (déjà ouvert, id bidon) → no-op propre.
  // Retourne { ok, reason:'ouvert'|'introuvable', item, entry, chestType, sourceLabel }.
  function openChest(chestId) {
    var st = store.get();
    var chest = findChest(st, chestId);
    if (!chest) return { ok: false, reason: 'introuvable' };
    var item = derive.drawForChest(st, chest);   // tiré au moment de l'ouverture
    if (!item) return { ok: false, reason: 'introuvable' };
    var entry = {
      id: uid('inv'),
      itemId: item.id,                            // seul l'id est stocké ; le reste se dérive (cards.resolve)
      day: store.todayKey(),
      sourceLabel: chest.sourceLabel,             // le souvenir de l'action réelle, repris du coffre
      photoId: null,
      note: null
    };
    store.set({
      chests: st.chests.filter(function (c) { return !(c && c.id === chestId); }),
      inventory: st.inventory.concat([entry])
    });
    return { ok: true, reason: 'ouvert', item: item, entry: entry, chestType: chest.type, sourceLabel: chest.sourceLabel };
  }

  /* ------------------------------------------------ quêtes minutées (Phase 1.4) */
  // Démarre une quête (catalogue OU perso). UN SEUL chrono actif (arbitrage Leo) : si une
  // quête VALIDE tourne déjà, on refuse (l'UI le dit doucement). Un activeQuest incohérent
  // (save bricolée) n'est PAS un obstacle → il est écrasé. `startedAt` = horloge murale
  // RÉELLE (Date.now()), persistée → reprise exacte après reload (leçon v1 P0-7). Aucune
  // récompense n'est SAISIE : elle sera dérivée de la durée à l'accomplissement.
  // spec = { questId|null, title, domain, minutes }. Retourne { ok, reason, quest }.
  function startQuest(spec) {
    spec = spec || {};
    var title = trim(spec.title);
    var minutes = +spec.minutes;
    if (!title || !domains.has(spec.domain) || !(minutes > 0)) return { ok: false, reason: 'invalide' };
    var st = store.get();
    if (derive.isValidActiveQuest(st.activeQuest)) return { ok: false, reason: 'deja_active' };
    var quest = {
      id: uid('q'),
      questId: (typeof spec.questId === 'string' && spec.questId) ? spec.questId : null,
      title: title,
      domain: spec.domain,
      minutes: minutes,
      startedAt: Date.now()
    };
    store.set({ activeQuest: quest });
    return { ok: true, reason: 'demarree', quest: quest };
  }

  // Accomplit la quête active. Gate NON punitif : refus PROPRE tant que < 50 % (rien n'est
  // retiré, aucune trace). Sinon : tire le MATÉRIAU du coffre (durée + pitié, decidé ICI →
  // le coffre porte sa rareté), pousse le coffre dans `chests` (ouverture = cérémonie 1.3),
  // date l'historique (kind:'quest', elan §6.2), met à jour la PITIÉ (bois → +1 ; fer+ → 0),
  // et libère le chrono. Une seule écriture. Retourne { ok, reason, chest, tier, elan }.
  function finishQuest() {
    var st = store.get();
    var aq = st.activeQuest;
    if (!derive.isValidActiveQuest(aq)) return { ok: false, reason: 'aucune' };
    var prog = derive.questProgress(aq, Date.now());
    if (!prog.gateReached) return { ok: false, reason: 'trop_tot', remainingToGateMs: prog.remainingToGateMs };

    var roll = derive.rollQuestChestTier(st, aq);
    var tier = roll.tier;                                   // 'bois' | 'fer' | 'or'
    var day = store.todayKey();
    var elan = derive.questElan(aq.minutes);
    var domain = aq.domain;
    var elanBefore = derive.domainElan(st, domain);         // élan du domaine AVANT cet accomplissement
    var chest = {
      id: uid('c'),
      type: tier,
      domain: domain,
      sourceLabel: 'Obtenu en accomplissant « ' + aq.title + ' » (' + aq.minutes + ' min)',
      day: day
    };
    var newChests = [chest];
    var entry = { kind: 'quest', refId: (aq.questId || aq.id), domain: domain, day: day, elan: elan };
    var since = (st.pity && typeof st.pity.ironSinceRare === 'number') ? st.pity.ironSinceRare : 0;
    var nextSince = (tier === 'bois') ? (since + 1) : 0;    // pitié : reset dès un fer+ (rare ou mieux)

    // Bâtiment (Phase 2.2) : l'élan de quête (+2/+3/+4) fait-il franchir un palier de niveau ?
    var levelUps = pushLevelChests(st, domain, elanBefore, elan, day, newChests);
    var patch = {
      history: st.history.concat([entry]),
      chests: st.chests.concat(newChests),
      pity: { ironSinceRare: nextSince },
      activeQuest: null
    };
    stampPlaced(st, domain, patch);                         // pose la fondation au 1er élan du domaine

    store.set(patch);
    return { ok: true, reason: 'accompli', chest: chest, tier: tier, elan: elan, levelUps: levelUps };
  }

  // Abandonne la quête active. NON punitif (avant OU après 50 %) : rien n'est retiré, aucune
  // trace d'historique, aucune honte — le chrono est simplement libéré (GDD §3.2). Idempotent.
  function abandonQuest() {
    var st = store.get();
    if (!st.activeQuest) return { ok: false, reason: 'aucune' };
    store.set({ activeQuest: null });
    return { ok: true, reason: 'abandonnee' };
  }

  window.AscendActions = {
    createHabit: createHabit,
    editHabit: editHabit,
    deleteHabit: deleteHabit,
    validateHabit: validateHabit,
    openChest: openChest,
    startQuest: startQuest,
    finishQuest: finishQuest,
    abandonQuest: abandonQuest
  };
})();

/* ASCEND v2 — L'île, LOBBY central du jeu (jalon M2, cap tranché le 2026-07-23).

   Contenu :
   - une SCÈNE SVG en calques (mer · île · parcelles/bâtiments · ponton · brume), pilotée au
     doigt en PAN + ZOOM via Pointer Events NATIFS (leçon v1 : pas de lib) ;
   - le MENU DU DOMAINE (3.1/3.3, passé en premium en 4.2b) : taper un bâtiment ouvre le hub
     de son domaine — bandeau illustré (le bâtiment RÉEL, à son niveau) + agir (valider une
     habitude, lancer une quête) + sa collection en cartes ;
   - le HUB DES COFFRES (3.2) : taper le ponton ouvre la pile « À découvrir » → cérémonie 1.3 ;
   - une VUE LISTE MIROIR sémantique (accessibilité NON négociable) : équivalent complet de la
     scène — les deux hubs y sont atteignables au clavier (mêmes dialogs).

   4.2b — le PLACEMENT des décorations sur l'île (Phase 2.3) a été RETIRÉ sur arbitrage de Leo :
   les objets se disposeront dans le MUSÉE (M3.3), pas sur l'île. Les positions déjà enregistrées
   restent dans la save (`placements`, jamais détruites, plus jamais lues ici) — voir state.js.

   Invariant d'intégrité (TDD §4) : tout ce qui s'affiche ici est DÉRIVÉ (niveau, élan,
   collection X/Y, coffres) ; ce module n'écrit RIEN d'autre que via actions.*.
   Placeholders géométriques ; les SVG Claude Design viendront en 2.4 sur les mêmes ancres.

   ctx = { view:'scene'|'liste', onView, ver, repaint, onOpenChest }. */
(function () {

  var derive = window.AscendDerive;
  var store = window.AscendStore;
  var actions = window.AscendActions;
  var cards = window.AscendCards;
  var chestTypes = window.AscendChests;

  var WORLD = { w: 1000, h: 700 };

  // Arc en croissant (5 ancres, avant de l'île). ids : parcelle-<domain>.

  var ARC = [
    { x: 208, y: 462 },
    { x: 340, y: 512 },
    { x: 500, y: 540 },
    { x: 660, y: 512 },
    { x: 792, y: 462 }
  ];
  var PLOT = { rx: 50, ry: 24 };   // socle d'une parcelle (rayon) — sert au rendu ET à l'écart

  // Vaguelettes du large — positions FIXES, toutes hors de l'anneau d'écume (donc jamais sur
  // la terre). Purement décoratives et STATIQUES : rien à neutraliser en reduce-motion.
  // 4.2c — les deux dernières (y 70 et 60) sont redescendues : elles seraient désormais DANS
  // LE CIEL, au-dessus de l'horizon. Toutes sont vérifiées hors de l'ellipse d'écume.

     - « et aussi » = trouvailles hors-catalogue du domaine (décos génératives, cartes-jalons),

  function invByItemId(st) {

    }

    }

    for (var j = 0; j < inv.length; j++) {
      var e2 = inv[j];
      if (!e2 || !e2.id || typeof e2.itemId !== 'string' || catIds[e2.itemId]) continue;
      var it2 = cards.resolve(e2.itemId);

  // Quelle parcelle sous ce point monde ? (bâtiment large ; le plus proche en x l'emporte).
  function parcelleDomainAt(pt) {
    var best = null, bd = 1e9;
    for (var i = 0; i < ARC.length && i < domains.list.length; i++) {
      var dx = pt.x - ARC[i].x, dy = pt.y - ARC[i].y;
      if (Math.abs(dx) <= 52 && dy <= 40 && dy >= -150) {

  }

  /* PIÈGE À FOCUS (4.2b) — jusqu'ici le panneau ne faisait que PRENDRE le focus : la tabulation
     s'en échappait vers la scène et les onglets, derrière le voile. On boucle la tabulation à
     l'intérieur du dialog ; Échap reste géré par l'appelant. */
  var FOCUSABLE = 'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  function trapTab(e) {
    if (e.key !== 'Tab') return;
    // La CÉRÉMONIE (z-80, montée à la racine de l'App) se joue PAR-DESSUS ce dialog : tant
    // qu'elle est là, le piège cède, sinon la tabulation boucle dans le hub et n'atteint
    // jamais « Rejoindre ma collection » (hub vidé de son dernier coffre = un seul focusable).
    if (document.querySelector('.ceremony')) return;
    var panel = e.currentTarget.querySelector('.dm-panel');
    if (!panel) return;
    var items = [];
    var all = panel.querySelectorAll(FOCUSABLE);
    for (var i = 0; i < all.length; i++) if (all[i].offsetParent !== null || all[i] === document.activeElement) items.push(all[i]);
    if (!items.length) { e.preventDefault(); panel.focus(); return; }
    var first = items[0], last = items[items.length - 1], act = document.activeElement;
    if (e.shiftKey && (act === first || act === panel)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus(); }
  }

  /* --------------------------------------------------- contrôleur PAN + ZOOM (natif)
     Manipule le viewBox du <svg> (coordonnées MONDE naturelles, focal-point exact).
     Un seul pointeur = pan ; deux = pinch ; molette = zoom au curseur (desktop).
     Bornes DOUCES ; détection tap-vs-pan (un tap ouvre un hub, un glisser ne fait que paner). */
  var AR = WORLD.h / WORLD.w;
  var MINW = WORLD.w / 3.2;     // zoom max (~3,2×)
  var MAXW = WORLD.w;           // dézoom max = île entière (fit)
  var MARGIN = 46;              // overscroll doux (unités monde)
  var savedView = null;         // { x, y, w, h } — persiste entre visites de l'onglet

  function makeController(svg) {
    var view = savedView
      ? { x: savedView.x, y: savedView.y, w: savedView.w, h: savedView.h }
      : { x: (WORLD.w - MAXW) / 2, y: (WORLD.h - MAXW * AR) / 2, w: MAXW, h: MAXW * AR };
    var pointers = {};
    var panAnchor = null;
    var pinch = null;
    var tapOk = false, tapDown = null;   // détection d'un TAP (vs pan/pinch) → ouvre un menu de domaine

    function count() { return Object.keys(pointers).length; }

    function clamp() {
      view.w = Math.max(MINW, Math.min(MAXW, view.w));
      view.h = view.w * AR;
      if (view.w >= WORLD.w) view.x = (WORLD.w - view.w) / 2;
      else view.x = Math.max(-MARGIN, Math.min(WORLD.w - view.w + MARGIN, view.x));
      if (view.h >= WORLD.h) view.y = (WORLD.h - view.h) / 2;
      else view.y = Math.max(-MARGIN, Math.min(WORLD.h - view.h + MARGIN, view.y));
    }
    function apply() {
      clamp();
      svg.setAttribute('viewBox', view.x + ' ' + view.y + ' ' + view.w + ' ' + view.h);
      savedView = { x: view.x, y: view.y, w: view.w, h: view.h };
    }
    function toWorld(cx, cy) {
      var r = svg.getBoundingClientRect();
      if (!r.width || !r.height) return { x: view.x + view.w / 2, y: view.y + view.h / 2 };
      var s = Math.min(r.width / view.w, r.height / view.h);
      var ox = (r.width - view.w * s) / 2, oy = (r.height - view.h * s) / 2;
      return { x: view.x + (cx - r.left - ox) / s, y: view.y + (cy - r.top - oy) / s };
    }
    function anchorAt(worldPt, cx, cy) {
      var r = svg.getBoundingClientRect();
      var s = Math.min(r.width / view.w, r.height / view.h);
      var ox = (r.width - view.w * s) / 2, oy = (r.height - view.h * s) / 2;
      view.x = worldPt.x - (cx - r.left - ox) / s;
      view.y = worldPt.y - (cy - r.top - oy) / s;
    }
    function midClient() {
      var ks = Object.keys(pointers), a = pointers[ks[0]], b = pointers[ks[1]];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
    function dist() {
      var ks = Object.keys(pointers), a = pointers[ks[0]], b = pointers[ks[1]];
      return Math.hypot(a.x - b.x, a.y - b.y);
    }
    function rebaseGesture() {
      var n = count();
      pinch = null; panAnchor = null;
      if (n === 1) {
        var k = Object.keys(pointers)[0];
        panAnchor = toWorld(pointers[k].x, pointers[k].y);
      } else if (n >= 2) {
        pinch = { dist: dist(), baseW: view.w };
      }
    }

    function onDown(e) {
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      if (count() === 1) { tapOk = true; tapDown = { x: e.clientX, y: e.clientY }; }
      else { tapOk = false; }
      rebaseGesture();
    }
    function onMove(e) {
      if (!pointers[e.pointerId]) return;
      pointers[e.pointerId].x = e.clientX; pointers[e.pointerId].y = e.clientY;
      if (tapOk && tapDown && Math.hypot(e.clientX - tapDown.x, e.clientY - tapDown.y) > 6) tapOk = false;
      var n = count();
      if (n === 1 && panAnchor) {
        var cur = toWorld(e.clientX, e.clientY);
        view.x -= (cur.x - panAnchor.x);
        view.y -= (cur.y - panAnchor.y);
        apply();
      } else if (n >= 2 && pinch && pinch.dist > 0) {
        var m = midClient();
        var midWorld = toWorld(m.x, m.y);
        var nd = dist();
        if (nd > 0) { view.w = Math.max(MINW, Math.min(MAXW, pinch.baseW * (pinch.dist / nd))); view.h = view.w * AR; }
        anchorAt(midWorld, m.x, m.y);
        apply();
      }
    }
    function onUp(e) {
      var wasTap = tapOk && count() === 1;      // ce pointeur est le dernier levé, sans mouvement
      var ux = e.clientX, uy = e.clientY;
      delete pointers[e.pointerId];
      try { svg.releasePointerCapture(e.pointerId); } catch (err) {}
      if (wasTap && count() === 0) { tapOk = false; handleTap(toWorld(ux, uy)); return; }
      rebaseGesture();
    }
    function onWheel(e) {
      e.preventDefault();
      tapOk = false;
      var w = toWorld(e.clientX, e.clientY);

      view.w = Math.max(MINW, Math.min(MAXW, view.w * f));
      view.h = view.w * AR;
      anchorAt(w, e.clientX, e.clientY);
      apply();
    }

    svg.addEventListener('pointerdown', onDown);
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('pointerup', onUp);
    svg.addEventListener('pointercancel', onUp);
    svg.addEventListener('wheel', onWheel, { passive: false });
    apply();

    return {
      reset: function () {
        view.x = (WORLD.w - MAXW) / 2; view.y = (WORLD.h - MAXW * AR) / 2;
        view.w = MAXW; view.h = MAXW * AR; apply();
      },
      destroy: function () {
        svg.removeEventListener('pointerdown', onDown);
        svg.removeEventListener('pointermove', onMove);
        svg.removeEventListener('pointerup', onUp);
        svg.removeEventListener('pointercancel', onUp);
        svg.removeEventListener('wheel', onWheel);
      }
    };
  }

  var controller = null;
  function initScene(node) {
    if (node) {
      if (controller) controller.destroy();
      controller = makeController(node);
    } else if (controller) {
      controller.destroy(); controller = null;
    }
  }
