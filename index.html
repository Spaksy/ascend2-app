  /* --------------------------------------------------------------- rendu SVG (calques) */
  function parcelles() {
    var list = domains.list, st = store.get(), out = [];
    for (var i = 0; i < list.length && i < ARC.length; i++) {
      var d = list[i];
      var info = derive.buildingInfo(st, d.id);
      var coll = domainCollection(st, d.id);
      out.push({ domain: d, x: ARC[i].x, y: ARC[i].y, id: 'parcelle-' + d.id, level: info.level,
                 elan: info.elan, remaining: info.remaining, collGot: coll.got, collTotal: coll.total });
    }
    return out;
  }
  function parcelleNode(p) { return (p.level >= 1) ? building(p) : ruin(p); }

  /* Le MÊME dessin, réemployé en vignette dans le bandeau du menu du domaine (4.2b) : on ne
     redessine rien, le bandeau montre le bâtiment RÉEL à son niveau réel. En mode `hero` on
     retire l'`id` (il vivrait alors en double dans le DOM avec la scène) et la pastille X/Y
     (le bandeau l'écrit déjà en toutes lettres). */
  function heroArt(p) {
    // Cadre ajusté à la hauteur réelle du bâtiment, avec un PLANCHER de 118 : sans lui, un cadre
    // collé au contenu grossissait les petits sujets et une ruine dormante se retrouvait dessinée
    // PLUS GRANDE qu'une tour de niveau 3 — l'échelle disait l'inverse de la progression.
    // 4.2c — la hauteur ne peut plus être devinée ici (chaque domaine a son archétype) : elle
    // vient de `buildingMetrics`, la source unique partagée avec la scène.
    var top = (p.level >= 1) ? buildingMetrics(p.domain.id, p.level).artTop : -44;
    var vh = Math.max(118, 34 - top);
    var box = '-64 ' + (34 - vh) + ' 128 ' + vh;
    var hp = { domain: p.domain, x: 0, y: 0, level: p.level };
    return html`
      <svg class="dm-heroart" viewBox=${box} preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <defs>
          <radialGradient id="dm-glow-g" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="var(--gold)" stop-opacity=".5" />
            <stop offset="0.5" stop-color="var(--gold)" stop-opacity=".18" />
            <stop offset="1" stop-color="var(--gold)" stop-opacity="0" />
          </radialGradient>
        </defs>
        ${(p.level >= 1) ? building(hp, true) : ruin(hp, true)}
      </svg>`;
  }

  // Petite pastille « X/Y » sous la parcelle : signale que le bâtiment est TAPPABLE (ouvre son
  // menu de domaine) et montre la progression de collection à même la scène (cap « île = lobby »).
  function collTag(got, total) {
    return html`
      <g class="isl-colltag" aria-hidden="true">
        <rect class="isl-colltag-bg" x="-23" y="27" width="46" height="17" rx="8.5" />
        <text class="isl-colltag-tx" x="0" y="35.5" text-anchor="middle">${got + '/' + total}</text>
      </g>`;
  }

  function waveNode(w, i) {
    return html`<path key=${'wv' + i} class="isl-wave"
                      d=${'M ' + (w.x - 16) + ' ' + w.y + ' q 8 -5 16 0 q 8 5 16 0'} />`;
  }

  // Socle commun d'une parcelle : ombre au sol + herbe + liseré de terre. C'est lui qui pose
  // le bâtiment DANS l'île au lieu de le faire flotter dessus.
  function plotNode() {
    return html`
      <g class="isl-plotset" aria-hidden="true">
        <ellipse class="isl-plot-sh" cx="3" cy="5" rx=${PLOT.rx + 3} ry=${PLOT.ry + 2} />
        <ellipse class="isl-plot" cx="0" cy="0" rx=${PLOT.rx} ry=${PLOT.ry} />
        <ellipse class="isl-plot-in" cx="0" cy="-2" rx=${PLOT.rx - 13} ry=${PLOT.ry - 8} />
      </g>`;
  }

  // Végétation d'une parcelle — elle s'étoffe avec le niveau (la vie revient autour du
  // bâtiment). Positions FIXES, écartées en 4.2c pour dégager l'emprise du PLUS LARGE des
  // archétypes (l'annexe de la bibliothèque, à −40) : jamais de chevauchement, et pas
  // davantage avec la végétation de la parcelle voisine (10 d'air au plus serré).
  var VEG = [{ x: -49, y: 10, s: 1 }, { x: 50, y: 7, s: .86 }, { x: -55, y: -5, s: .72 }, { x: 55, y: -3, s: .78 }];
  function shrub(v, i) {
    return html`
      <g key=${'v' + i} class="isl-shrub" transform=${'translate(' + v.x + ',' + v.y + ') scale(' + v.s + ')'}>
        <ellipse class="isl-shrub-sh" cx="1" cy="3" rx="9" ry="3.2" />
        <rect class="isl-trunk" x="-1.4" y="-7" width="2.8" height="10" rx="1.2" />
        <circle class="isl-leaf-a" cx="-4" cy="-11" r="6.4" />
        <circle class="isl-leaf-a" cx="4.6" cy="-9.5" r="5.4" />
        <circle class="isl-leaf-b" cx="0" cy="-16" r="5.8" />
      </g>`;
  }

  // L'enseigne du domaine, hissée au-dessus du toit : mât + plaque ronde. C'est le repère qui
  // permet d'identifier un domaine d'un coup d'œil, même dézoomé.
  function signNode(d, y) {
    return html`
      <g class="isl-sign" aria-hidden="true">
        <rect class="isl-stem" x="-1.8" y=${y + 10} width="3.6" height="16" rx="1.6" />
        <circle class="isl-badge-sh" cx="1.5" cy=${y + 2} r="15" />
        <circle class="isl-badge" cx="0" cy=${y} r="15" />
        <text class="isl-emoji" x="0" y=${y + 7} text-anchor="middle">${d.emoji}</text>
      </g>`;
  }

  function ruin(p, hero) {
    var d = p.domain;
    return html`
      <g id=${hero ? null : p.id} class="isl-parcelle" transform=${'translate(' + p.x + ',' + p.y + ')'}
         data-domain=${d.id} data-level="0">
        ${plotNode()}
        <ellipse class="isl-ruin-sh" cx="4" cy="-3" rx="30" ry="10" />
        <rect class="isl-ruin" x="-31" y="-28" width="11" height="24" rx="3" />
        <rect class="isl-ruin isl-ruin-hi" x="-31" y="-28" width="4" height="24" rx="2" />
        <rect class="isl-ruin" x="-6"  y="-36" width="12" height="33" rx="3" />
        <rect class="isl-ruin isl-ruin-hi" x="-6" y="-36" width="4.5" height="33" rx="2" />
        <rect class="isl-ruin" x="20"  y="-24" width="10" height="20" rx="3" />
        <path class="isl-rubble" d="M -18 -5 l 7 0 l 2 5 l -11 0 z" />
        <path class="isl-rubble" d="M 9 -7 l 9 0 l 3 7 l -14 0 z" />
        <ellipse class="isl-moss" cx="-25" cy="-6" rx="7" ry="3" />
        <ellipse class="isl-moss" cx="1" cy="-4" rx="9" ry="3.4" />
        ${signNode(d, -18)}
        ${hero ? null : collTag(p.collGot, p.collTotal)}
      </g>`;
  }

  /* ------------------------------------------------- ARCHÉTYPES DE BÂTIMENT (4.2c)
     Grief nommé par Leo : « les 5 bâtiments sont identiques ». C'était exact au pixel près —
     même corps de 46, même toit à deux pans, mêmes fenêtres : seuls l'emoji de l'enseigne et
     la teinte changeaient. Chaque domaine reçoit donc SA silhouette (arbitrage Leo, « un
     archétype par domaine ») :
       physique      — palestre trapue, toit-terrasse à parapet, portique à deux colonnes
       mental        — tour d'observatoire élancée, coupole et fleuron
       connaissances — bibliothèque à pignon, oculus, annexe basse (asymétrie assumée)
       creativite    — atelier à verrière en dents de scie, grande baie vitrée
       bienetre      — pavillon arrondi, toit courbe débordant, véranda
     Ce qui NE bouge PAS : l'ancre `parcelle-<domain>`, un étage par niveau (1→6), le mode
     `hero` du bandeau (4.2b), la boîte de tap (±52 en x, −150 en y : le plus haut des cinq
     culmine à −147), et le VOCABULAIRE COMMUN (mêmes murs, mêmes toits, mêmes fenêtres
     dorées, mêmes tokens) — c'est lui qui garde le village lisible comme UN village.
     Placeholders géométriques : les assets 2.4 se substitueront sur les mêmes ancres.
       w/floorH/base — largeur du corps, hauteur d'un étage, hauteur du rez
       roof/roofH    — famille de toit et sa hauteur ; signGap — air sous l'enseigne
       winX/winW     — percements d'un étage ; entryW — demi-largeur de l'entrée au sol */
  var ARCH = {
    physique:      { w: 60, floorH: 13, base: 24, roof: 'plat',    roofH: 9,  signGap: 22, winX: [-27, -3.75, 19.5], winW: 7.5, entry: 'portique', entryW: 19 },
    mental:        { w: 32, floorH: 16, base: 16, roof: 'coupole', roofH: 18, signGap: 24, winX: [-3], winW: 6, entry: 'porte', entryW: 6 },
    connaissances: { w: 54, floorH: 14, base: 18, roof: 'pignon',  roofH: 20, signGap: 22, winX: [-19, 10], winW: 9, entry: 'perron', entryW: 7, annex: true },
    creativite:    { w: 52, floorH: 14, base: 18, roof: 'shed',    roofH: 13, signGap: 18, winX: [-16, 9], winW: 7, entry: 'baie', entryW: 16 },
    bienetre:      { w: 46, floorH: 14, base: 18, roof: 'courbe',  roofH: 12, signGap: 22, winX: [-13, 7], winW: 6, winRx: 3, bodyRx: 10, entry: 'veranda', entryW: 6 }
  };
  // Les 5 autres domaines de lancement (post-validation) n'ont pas encore d'archétype :
  // ils retombent sur celui d'origine plutôt que de faire disparaître un bâtiment.
  var ARCH_DEFAULT = { w: 46, floorH: 15, base: 18, roof: 'pignon', roofH: 14, signGap: 24, winX: [-13, 7], winW: 6, entry: 'porte', entryW: 6 };
  function archOf(id) { return Object.prototype.hasOwnProperty.call(ARCH, id) ? ARCH[id] : ARCH_DEFAULT; }

  /* Mesures d'un bâtiment — SEULE source de sa géométrie, partagée par la scène ET par le
     cadrage du bandeau du menu (`heroArt`) : les deux ne peuvent plus diverger. */
  function buildingMetrics(id, level) {
    var A = archOf(id);
    var L = Math.max(1, Math.min(level, 6));
    var bodyH = A.base + (L - 1) * A.floorH;
    var topY = 6 - bodyH;                                 // 6 = ligne de sol du corps
    var signY = topY - A.roofH - A.signGap;               // enseigne au-dessus du toit
    return { A: A, L: L, half: A.w / 2, bodyH: bodyH, topY: topY, signY: signY, artTop: signY - 19 };
  }

  // Les toits. Ils partagent les mêmes classes (donc les mêmes tokens de matière) : c'est ce
  // qui empêche les 5 silhouettes de se disloquer en 5 styles étrangers l'un à l'autre.
  function roofNode(A, half, y) {
    if (A.roof === 'plat') {
      return html`
        <g>
          <rect class="isl-roof" x=${-half - 6} y=${y - A.roofH} width=${A.w + 12} height=${A.roofH} rx="1.5" />
          <rect class="isl-roof-hi" x=${-half - 6} y=${y - A.roofH} width=${(A.w + 12) * .42} height=${A.roofH} rx="1.5" />
          <rect class="isl-roof" x=${-half - 1} y=${y - A.roofH - 4} width="6" height="4" rx="1" />
          <rect class="isl-roof" x=${half - 5} y=${y - A.roofH - 4} width="6" height="4" rx="1" />
          <rect class="isl-eaves" x=${-half - 9} y=${y - 3.5} width=${A.w + 18} height="4.5" rx="2.2" />
        </g>`;
    }
    if (A.roof === 'coupole') {
      var rr = half + 3;
      return html`
        <g>
          <path class="isl-roof" d=${'M ' + (-rr) + ' ' + y + ' a ' + rr + ' ' + A.roofH + ' 0 0 1 ' + (rr * 2) + ' 0 Z'} />
          <path class="isl-roof-hi" d=${'M ' + (-rr) + ' ' + y + ' a ' + rr + ' ' + A.roofH + ' 0 0 1 ' + rr + ' ' + (-A.roofH) + ' L 0 ' + y + ' Z'} />
          <rect class="isl-eaves" x=${-rr - 3} y=${y - 2} width=${rr * 2 + 6} height="4" rx="2" />
          <circle class="isl-finial" cx="0" cy=${y - A.roofH - 3.5} r="3.2" />
        </g>`;
    }
    if (A.roof === 'shed') {
      var teeth = [], tw = (A.w + 8) / 3, x0 = -half - 4, k;
      for (k = 0; k < 3; k++) {
        var a = x0 + k * tw, b = a + tw;
        teeth.push(html`<polygon key=${'sh' + k} class="isl-roof"
                                 points=${a + ',' + y + ' ' + b + ',' + (y - A.roofH) + ' ' + b + ',' + y} />`);
        teeth.push(html`<rect key=${'sg' + k} class="isl-glass" x=${b - 3} y=${y - A.roofH} width="3" height=${A.roofH} />`);
      }
      return html`
        <g>
          ${teeth}
          <rect class="isl-eaves" x=${-half - 5} y=${y} width=${A.w + 10} height="3.5" rx="1.7" />
        </g>`;
    }
    if (A.roof === 'courbe') {
      var ov = half + 14;
      return html`
        <g>
          <path class="isl-roof" d=${'M ' + (-ov) + ' ' + y + ' Q 0 ' + (y - A.roofH - 9) + ' ' + ov + ' ' + y + ' Z'} />
          <path class="isl-roof-hi" d=${'M ' + (-ov) + ' ' + y + ' Q ' + (-ov * .5) + ' ' + (y - A.roofH - 7) + ' 0 ' + (y - A.roofH * .62) + ' Z'} />
          <rect class="isl-eaves" x=${-ov - 2} y=${y - 1} width=${ov * 2 + 4} height="4" rx="2" />
          <circle class="isl-finial" cx="0" cy=${y - (A.roofH + 9) / 2 - 2} r="2.8" />
        </g>`;
    }
    var eave = 8;                                          // 'pignon'
    return html`
      <g>
        <polygon class="isl-roof" points=${(-half - eave) + ',' + y + ' 0,' + (y - A.roofH) + ' ' + (half + eave) + ',' + y} />
        <polygon class="isl-roof-hi" points=${(-half - eave) + ',' + y + ' 0,' + (y - A.roofH) + ' 0,' + y} />
        <circle class="isl-win" cx="0" cy=${y - A.roofH * .42} r="3.4" />
        <rect class="isl-eaves" x=${-half - eave - 1} y=${y} width=${A.w + eave * 2 + 2} height="3.5" rx="1.7" />
      </g>`;
  }

  // L'entrée — le détail au sol qui achève de caractériser le lieu.
  function entranceNode(A) {
    if (A.entry === 'portique') {
      return html`
        <g>
          <rect class="isl-door" x="-5" y="-6" width="10" height="12" rx="2" />
          <!-- colonnes en matière de TOIT et non de mur : en isl-tower (mur sur mur) le
               portique était rigoureusement invisible au rendu. -->
          <rect class="isl-eaves" x="-19" y="-8" width="4.5" height="14" rx="1.6" />
          <rect class="isl-eaves" x="14.5" y="-8" width="4.5" height="14" rx="1.6" />
          <rect class="isl-eaves" x="-21" y="-11.5" width="42" height="3.5" rx="1.7" />
        </g>`;
    }
    if (A.entry === 'perron') {
      return html`
        <g>
          <rect class="isl-door" x="-6" y="-7" width="12" height="13" rx="2" />
          <rect class="isl-eaves" x="-12" y="3.5" width="24" height="3.5" rx="1.7" />
        </g>`;
    }
    if (A.entry === 'baie') {
      return html`
        <g>
          <rect class="isl-glass" x="-15" y="-10" width="30" height="16" rx="2" />
          <line class="isl-sill" x1="-5" y1="-10" x2="-5" y2="6" />
          <line class="isl-sill" x1="5" y1="-10" x2="5" y2="6" />
          <rect class="isl-door" x="-3" y="-4" width="6" height="10" rx="1.4" />
        </g>`;
    }
    if (A.entry === 'veranda') {
      return html`
        <g>
          <path class="isl-door" d="M -5 6 v -7 a 5 5.5 0 0 1 10 0 v 7 z" />
          <rect class="isl-eaves" x=${-A.w / 2 - 9} y="4" width=${A.w + 18} height="3.5" rx="1.7" />
        </g>`;
    }
    return html`<rect class="isl-door" x="-4" y="-6" width="8" height="12" rx="1.8" />`;
  }

  // Annexe basse de la bibliothèque : c'est elle qui casse la symétrie et fait lire un
  // bâtiment qui a grandi par ajouts plutôt qu'une boîte posée là.
  function annexNode(half) {
    return html`
      <g>
        <ellipse class="isl-cast" cx=${-half - 5} cy="4" rx="15" ry="6" />
        <rect class="isl-tower" x=${-half - 13} y="-11" width="17" height="17" rx="2" />
        <polygon class="isl-roof" points=${(-half - 15) + ',-11 ' + (-half + 3) + ',-21 ' + (-half + 3) + ',-11'} />
        <rect class="isl-eaves" x=${-half - 16} y="-11.5" width="20" height="3" rx="1.5" />
        <rect class="isl-win" x=${-half - 9} y="-6" width="6.5" height="8" rx="1.2" />
      </g>`;
  }

  function building(p, hero) {
    var d = p.domain;
    var m = buildingMetrics(d.id, p.level);
    var A = m.A, L = m.L, half = m.half, topY = m.topY;
    var glowOp = Math.min(0.85, 0.3 + L * 0.09);
    var brx = Math.min(A.bodyRx || 3, m.bodyH / 3);
    var shW = Math.min(11, A.w * 0.24);
    var wins = [], bands = [], f, k;
    for (f = 0; f < L; f++) {
      var wy = -6 - f * A.floorH;
      var row = [];
      for (k = 0; k < A.winX.length; k++) {
        // Au rez-de-chaussée on ne perce pas une fenêtre DERRIÈRE l'entrée (le portique de la
        // palestre, la baie de l'atelier) : elle y serait invisible ou en collision.
        if (f === 0 && Math.abs(A.winX[k] + A.winW / 2) < A.entryW + A.winW / 2) continue;
        row.push(html`<rect key=${'x' + k} class="isl-win" x=${A.winX[k]} y=${wy}
                            width=${A.winW} height="8" rx=${A.winRx || 1.2} />`);
      }
      wins.push(html`
        <g key=${'w' + f}>
          ${row}
          <line class="isl-sill" x1=${-half + 1.5} y1=${wy + 9.4} x2=${half - 1.5} y2=${wy + 9.4} />
        </g>`);
      if (f) bands.push(html`<line key=${'b' + f} class="isl-band" x1=${-half} y1=${wy + 12.5} x2=${half} y2=${wy + 12.5} />`);
    }
    return html`
      <g id=${hero ? null : p.id} class="isl-parcelle isl-built" transform=${'translate(' + p.x + ',' + p.y + ')'}
         data-domain=${d.id} data-level=${p.level} data-arch=${A.roof}>
        <ellipse class="isl-glow" cx="0" cy=${topY + m.bodyH * 0.35} rx=${34 + L * 9} ry=${(34 + L * 9) * 0.7}
                 style=${'opacity:' + glowOp} />
        ${plotNode()}
        ${VEG.slice(0, Math.min(VEG.length, L)).map(shrub)}
        <ellipse class="isl-cast" cx=${half * 0.55} cy="0" rx=${half * 0.95} ry="9" />
        ${A.annex ? annexNode(half) : null}
        <rect class="isl-tower" x=${-half} y=${topY} width=${A.w} height=${m.bodyH} rx=${brx} />
        <rect class="isl-tower-sh" x=${half - shW} y=${topY} width=${shW} height=${m.bodyH} rx=${brx} />
        ${bands}
        ${wins}
        ${roofNode(A, half, topY)}
        ${entranceNode(A)}
        ${signNode(d, m.signY)}
        ${hero ? null : collTag(p.collGot, p.collTotal)}
      </g>`;
  }

  // Un petit coffre posé sur le ponton (placeholder géométrique ; l'asset réel viendra en 2.4).
  function miniChest(dx, dy) {
    return html`
      <g transform=${'translate(' + dx + ',' + dy + ')'}>
        <rect class="isl-dchest-body" x="-9" y="-5" width="18" height="12" rx="2" />
        <rect class="isl-dchest-lid"  x="-10" y="-9" width="20" height="6" rx="2.5" />
        <rect class="isl-dchest-clasp" x="-2" y="-6" width="4" height="6" rx="1" />
      </g>`;
  }

  // Le PONTON des coffres (Phase 3.2) — ancre STABLE `ponton-coffres`, tap → hub des coffres.
  // Structure permanente (elle fait partie de l'île) ; les coffres et la pastille de compte
  // n'apparaissent que s'il y en a (état vide serein). Placeholder ; SVG Claude Design en 2.4.
  function pontonNode() {
    var st = store.get();
    var n = chestList(st).length;
    var shown = Math.min(3, n);
    var chests = [];
    if (shown >= 1) chests.push(miniChest(-14, -3));
    if (shown >= 2) chests.push(miniChest(9, -3));
    if (shown >= 3) chests.push(miniChest(-3, -13));
    return html`
      <g id="ponton-coffres" class="isl-ponton" transform=${'translate(' + PONTON.x + ',' + PONTON.y + ')'}
         data-count=${n} aria-hidden="true">
        <ellipse class="isl-dock-shadow" cx="2" cy="22" rx="50" ry="14" />
        <ellipse class="isl-dock-ripple" cx="2" cy="24" rx="58" ry="17" />
        <rect class="isl-dock-pile" x="-30" y="14" width="6" height="22" rx="2" />
        <rect class="isl-dock-pile" x="26" y="14" width="6" height="22" rx="2" />
        <rect class="isl-dock" x="-42" y="-8" width="84" height="26" rx="4" />
        <line class="isl-dock-plank" x1="-21" y1="-8" x2="-21" y2="18" />
        <line class="isl-dock-plank" x1="0" y1="-8" x2="0" y2="18" />
        <line class="isl-dock-plank" x1="21" y1="-8" x2="21" y2="18" />
        <rect class="isl-dock-edge" x="-42" y="-8" width="84" height="3.5" rx="1.7" />
        <!-- bitte d'amarrage + cordage : l'embarcadère où les coffres accostent -->
        <rect class="isl-bollard" x="33" y="-20" width="7" height="16" rx="3" />
        <path class="isl-rope" d="M 36 -18 q -14 8 -30 4" />
        ${chests}
        ${n > 0
          ? html`
            <g class="isl-ponton-tag">
              <rect class="isl-ponton-bg" x="-16" y="26" width="32" height="18" rx="9" />
              <text class="isl-ponton-tx" x="0" y="35" text-anchor="middle">${n}</text>
            </g>`
          : null}
      </g>`;
  }

  /* ------------------------------------------------------------------- CIEL (4.2c)
     Tout est STATIQUE (arbitrage Leo) : aucune animation à neutraliser en reduce-motion.
     Les étoiles se peignent avec `--star`, transparent hors nuit — c'est le CSS qui décide
     de l'ambiance, jamais une branche JS. Le ciel n'est pas tappable et ne porte aucun
     état : le miroir Liste n'a rien de neuf à refléter. */
  function cloudNode(c, i) {
    return html`
      <g key=${'cl' + i} class="isl-cloud" transform=${'translate(' + c.x + ',' + c.y + ') scale(' + c.s + ')'}>
        <ellipse cx="-20" cy="4" rx="24" ry="9" />
        <ellipse cx="8" cy="6" rx="30" ry="11" />
        <ellipse cx="-4" cy="-6" rx="20" ry="13" />
        <ellipse cx="18" cy="-2" rx="16" ry="10" />
      </g>`;
  }
  function farIsleNode(f, i) {
    var x = f.x, w = f.w, h = f.h, H = HORIZON;
    return html`<path key=${'fi' + i} class="isl-farisle" d=${
      'M ' + (x - w / 2) + ' ' + H +
      ' C ' + (x - w / 4) + ' ' + (H - h) + ' ' + (x - w / 8) + ' ' + (H - h) + ' ' + x + ' ' + (H - h * .55) +
      ' C ' + (x + w / 5) + ' ' + (H - h * 1.15) + ' ' + (x + w / 3) + ' ' + (H - h * .9) +
      ' ' + (x + w / 2) + ' ' + H + ' Z'} />`;
  }
  function starNode(s, i) { return html`<circle key=${'st' + i} class="isl-star" cx=${s.x} cy=${s.y} r=${s.r} />`; }

  function skyNode() {
    return html`
      <g class="isl-skylayer" aria-hidden="true">
        <rect x="-80" y="-80" width=${WORLD.w + 160} height=${HORIZON + 80} fill="url(#isl-sky-g)" />
        ${STARS.map(starNode)}
        <circle class="isl-astre-glow" cx=${ASTRE.x} cy=${ASTRE.y} r=${ASTRE.r * 2.6} />
        <circle class="isl-astre" cx=${ASTRE.x} cy=${ASTRE.y} r=${ASTRE.r} />
        ${CLOUDS.map(cloudNode)}
        ${FAR_ISLES.map(farIsleNode)}
        <rect class="isl-horizon" x="-80" y=${HORIZON - 2} width=${WORLD.w + 160} height="4" />
      </g>`;
  }

  /* ------------------------------------------------- PLACE CENTRALE & SENTIERS (4.2c)
     Décor pur : rien de tappable, rien de stocké, rien de dérivé — la place ne dépend
     d'aucun état, elle est là dès le premier boot comme le rivage. */
  function walkNode(a, i) {
    var ang = Math.atan2((a.y - PLAZA.y) / PLAZA.ry, (a.x - PLAZA.x) / PLAZA.rx);
    var px = PLAZA.x + PLAZA.rx * Math.cos(ang), py = PLAZA.y + PLAZA.ry * Math.sin(ang);
    var vx = a.x - px, vy = a.y - py, len = Math.sqrt(vx * vx + vy * vy) || 1;
    var nx = -vy / len, ny = vx / len;
    var ex = a.x - vx * .12, ey = a.y - vy * .12;   // le sentier s'arrête sur le socle
    // Largeurs volontairement SERRÉES : au premier jet (6 → 15) les six sentiers s'évasaient
    // en éventail et se lisaient comme des faisceaux de projecteur braqués depuis la place —
    // vu à la rastérisation, invisible au DOM. Un chemin ne s'évase presque pas.
    var w0 = 3.5, w1 = 7;
    return html`<path key=${'wk' + i} class="isl-walk" d=${
      'M ' + (px + nx * w0) + ' ' + (py + ny * w0) +
      ' L ' + (ex + nx * w1) + ' ' + (ey + ny * w1) +
      ' L ' + (ex - nx * w1) + ' ' + (ey - ny * w1) +
      ' L ' + (px - nx * w0) + ' ' + (py - ny * w0) + ' Z'} />`;
  }
  function walksNode() { return ARC.concat([WALK_TO_PONTON]).map(walkNode); }

  function plazaNode() {
    var spokes = [], i, a, c, s;
    for (i = 0; i < PLAZA_SPOKES; i++) {
      a = (i / PLAZA_SPOKES) * Math.PI * 2; c = Math.cos(a); s = Math.sin(a);
      spokes.push(html`<line key=${'sp' + i} class="isl-pave"
        x1=${PLAZA.x + PLAZA.rx * .42 * c} y1=${PLAZA.y + PLAZA.ry * .42 * s}
        x2=${PLAZA.x + PLAZA.rx * .94 * c} y2=${PLAZA.y + PLAZA.ry * .94 * s} />`);
    }
    return html`
      <g class="isl-plaza" aria-hidden="true">
        <ellipse class="isl-plaza-sh" cx=${PLAZA.x + 3} cy=${PLAZA.y + 5} rx=${PLAZA.rx + 3} ry=${PLAZA.ry + 3} />
        <ellipse class="isl-plaza-fl" cx=${PLAZA.x} cy=${PLAZA.y} rx=${PLAZA.rx} ry=${PLAZA.ry} />
        <ellipse class="isl-plaza-ring" cx=${PLAZA.x} cy=${PLAZA.y} rx=${PLAZA.rx * .94} ry=${PLAZA.ry * .94} />
        ${spokes}
        <ellipse class="isl-plaza-ring" cx=${PLAZA.x} cy=${PLAZA.y} rx=${PLAZA.rx * .42} ry=${PLAZA.ry * .42} />
      </g>`;
  }

  function Scene() {
    var st = store.get();
    var ps = parcelles();
    var totalLv = derive.totalBuildingLevels(st);
    // 4.2a — recalibré sur l'île AGRANDIE : avec les anciens seuils la brume ne mordait plus
    // sur la terre (elle flottait au large) et le signal « elle recule quand tu progresses »
    // (2.2) était devenu invisible. Elle voile de nouveau la périphérie à débloquer.
    var clear = Math.min(0.94, 0.5 + totalLv * 0.028).toFixed(3);
    var fogOut = Math.max(0.4, 0.9 - totalLv * 0.03).toFixed(3);
    var fit = ((WORLD.w - MAXW) / 2) + ' ' + ((WORLD.h - MAXW * AR) / 2) + ' ' + MAXW + ' ' + (MAXW * AR);
    var initBox = savedView ? (savedView.x + ' ' + savedView.y + ' ' + savedView.w + ' ' + savedView.h) : fit;

    return html`
      <div class="isl-stage">
        <svg class="isl-svg" viewBox=${initBox} preserveAspectRatio="xMidYMid meet"
             role="img" aria-label="Scène de ton île — vue décorative ; l’équivalent accessible est la vue Liste."
             ref=${initScene}>
          <defs>
            <!-- Ciel (4.2c) : mêmes tokens que le ciel CSS de la 0.3 (--sky-top/--sky-mid),
                 donc le letterbox autour du SVG et le ciel dessiné restent d'une seule pièce. -->
            <linearGradient id="isl-sky-g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--sky-top)" />
              <stop offset="1" stop-color="var(--sky-mid)" />
            </linearGradient>
            <radialGradient id="isl-astre-g" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="var(--astre)" stop-opacity=".55" />
              <stop offset="0.45" stop-color="var(--astre)" stop-opacity=".16" />
              <stop offset="1" stop-color="var(--astre)" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="isl-sea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--sea-1)" />
              <stop offset="1" stop-color="var(--sea-2)" />
            </linearGradient>
            <radialGradient id="isl-land" cx="0.5" cy="0.42" r="0.75">
              <stop offset="0" stop-color="var(--land)" />
              <stop offset="1" stop-color="var(--land-2)" />
            </radialGradient>
            <!-- Halo d'un bâtiment : un vrai dégradé de LUMIÈRE qui s'éteint. En aplat doré, il
                 virait au kaki sur l'herbe et se lisait comme une tache de terre. -->
            <radialGradient id="isl-glow-g" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="var(--gold)" stop-opacity=".5" />
              <stop offset="0.5" stop-color="var(--gold)" stop-opacity=".18" />
              <stop offset="1" stop-color="var(--gold)" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="isl-fog" cx="0.5" cy="0.5" r="0.62">
              <stop offset="0" stop-color="var(--fog)" stop-opacity="0" />
              <stop offset=${clear} stop-color="var(--fog)" stop-opacity="0" />
              <stop offset="1" stop-color="var(--fog)" stop-opacity=${fogOut} />
            </radialGradient>
          </defs>

          <!-- CALQUE ciel (4.2c) : la mer ne couvre plus tout le monde — au-dessus de l'horizon
               il y a enfin un ciel, son astre, ses nuages et deux îlots au loin. La brume (2.2)
               les voile légèrement et se lève avec la progression : perspective aérienne offerte. -->
          ${skyNode()}

          <rect class="isl-mer" x="-80" y=${HORIZON} width=${WORLD.w + 160} height=${WORLD.h + 80 - HORIZON} fill="url(#isl-sea)" />
          <!-- vaguelettes du large : quelques traits fixes (aucune animation → reduce-motion d'office) -->
          <g class="isl-waves" aria-hidden="true">${WAVES.map(waveNode)}</g>

          <!-- CALQUE île : ombre portée sur l'eau · écume · sable mouillé · plage · herbe · relief.
               Ces couches donnent l'épaisseur qui manquait — l'île se pose dans la mer. -->
          <g class="isl-land">
            <ellipse class="isl-seashade" cx=${ISLE.cx + 8} cy=${ISLE.cy + 26} rx=${ISLE.rx + 10} ry=${ISLE.ry + 8} />
            <ellipse class="isl-foam" cx=${ISLE.cx} cy=${ISLE.cy + 8} rx=${ISLE.rx + 26} ry=${ISLE.ry + 22} />
            <ellipse class="isl-shore" cx=${ISLE.cx} cy=${ISLE.cy + 10} rx=${ISLE.rx + 16} ry=${ISLE.ry + 14} />
            <ellipse class="isl-beach" cx=${ISLE.cx} cy=${ISLE.cy + 4} rx=${ISLE.rx + 6} ry=${ISLE.ry + 6} />
            <ellipse cx=${ISLE.cx} cy=${ISLE.cy} rx=${ISLE.rx} ry=${ISLE.ry} fill="url(#isl-land)" />
          </g>

          <!-- CALQUE place & sentiers (4.2c) : le centre n'est plus un trou d'herbe où l'œil
               tombe — les 6 sentiers (5 parcelles + le ponton) l'y conduisent. Le musée (M3)
               n'est PAS anticipé : la place est vide, elle sera son parvis le jour venu. -->
          <g class="isl-walks" aria-hidden="true">${walksNode()}</g>
          ${plazaNode()}

          <!-- CALQUE parcelles — TRIÉES par profondeur (y croissant) : les parcelles du fond
               sont peintes en premier, celles de l'avant les recouvrent. C'est ce tri qui fait
               lire l'écart comme de la PERSPECTIVE et non comme un encombrement. -->
          <g class="isl-parcelles">${ps.slice().sort(byDepth).map(parcelleNode)}</g>
          <!-- CALQUE ponton des coffres (Phase 3.2 : tap → hub des coffres → cérémonie 1.3) -->
          <g class="isl-pontons">${pontonNode()}</g>

          <rect class="isl-brume" x="-80" y="-80" width=${WORLD.w + 160} height=${WORLD.h + 160} fill="url(#isl-fog)" />
        </svg>

        <div class="isl-hint" aria-hidden="true">Touche un bâtiment ou le ponton des coffres · glisse pour explorer</div>

        <button class="isl-recenter" type="button" onClick=${recenter} aria-label="Recentrer la vue de l’île">Recentrer</button>

        ${totalLv === 0
          ? html`
            <div class="isl-wake" role="note">
              <span class="iw-emoji" aria-hidden="true">🌱</span>
              <p>Ton île s’éveille. Ces fondations en ruines attendent que ton élan les relève —
              touche l’une d’elles pour agir dans son domaine.</p>
            </div>`
          : null}
      </div>`;
  }

  /* ------------------------------------------------------------- vue LISTE (miroir 1:1)
     Équivalent sémantique complet de la scène (a11y NON négociable) : les deux lieux tappables
     — les 5 parcelles et le ponton — y sont atteignables au clavier, et ouvrent les MÊMES
     dialogs. Depuis 4.2b la scène n'a plus d'emplacements de déco : le miroir non plus. */
  function List() {
    var st = store.get();
    var ps = parcelles();
    var chests = chestList(st).slice().reverse();   // plus récents en haut (miroir du ponton)
    return html`
      <div class="isl-list">
        <p class="isl-list-lead">Vue liste de ton île — équivalent complet de la scène. Chaque
        domaine s’ouvre ici comme en le touchant sur la carte.</p>

        <h3 class="isl-list-h">Parcelles de domaine (5)</h3>
        <ul class="isl-items">
          ${ps.map(function (p) {
            var built = p.level >= 1;
            var state = built
              ? ('Niveau ' + p.level + ' · élan ' + p.elan + ' · plus que ' + p.remaining + ' avant le niveau ' + (p.level + 1))
              : 'Fondation en ruines · en sommeil';
            var aria = built
              ? ('Parcelle ' + p.domain.label + ' — bâtiment de niveau ' + p.level + ', élan ' + p.elan +
                 '. Plus que ' + p.remaining + ' d’élan avant le niveau ' + (p.level + 1) + '.')
              : ('Parcelle ' + p.domain.label + ' — fondation en ruines, en sommeil. Le bâtiment s’élèvera avec ton élan.');
            return html`
              <li class="isl-item ${built ? 'built' : ''}" tabindex="0" aria-label=${aria}>
                <span class="ii-emoji" aria-hidden="true">${p.domain.emoji}</span>
                <span class="ii-main">
                  <span class="ii-title">${p.domain.label}${built ? html`<span class="ii-lv">Nv ${p.level}</span>` : null}</span>
                  <span class="ii-state">${state}</span>
                  <div class="ii-actions">
                    <button class="lnk dm-open" type="button"
                            aria-label=${'Ouvrir le domaine ' + p.domain.label + ' — collection ' + p.collGot + ' sur ' + p.collTotal}
                            onClick=${function () { openDomain(p.domain.id); }}>Voir le domaine · ${p.collGot}/${p.collTotal}</button>
                  </div>
                </span>
              </li>`;
          })}
        </ul>

        <h3 class="isl-list-h">À découvrir · coffres (${chests.length})</h3>
        ${chests.length
          ? html`<ul class="isl-items">
              ${chests.map(function (c) {
                var t = chestTypes.get(c.type);
                var typeLabel = t ? t.label : 'Coffre';
                return html`
                  <li class="isl-item" aria-label=${typeLabel + ' — ' + (c.sourceLabel || 'à ouvrir') + '.'}>
                    <span class="ii-emoji" aria-hidden="true">🧰</span>
                    <span class="ii-main">
                      <span class="ii-title">${typeLabel}</span>
                      <span class="ii-state">${c.sourceLabel}</span>
                      <div class="ii-actions">
                        <button class="btn ii-go" type="button" aria-label=${'Ouvrir : ' + typeLabel}
                                onClick=${function () { onOpenChest(c.id); }}>Ouvrir</button>
                      </div>
                    </span>
                  </li>`;
              })}
            </ul>`
          : html`<p class="empty-soft">Aucun coffre en attente — tes prochaines actions en feront accoster au ponton.</p>`}
      </div>`;
  }

  /* ------------------------------------------------------- menu du domaine (Phase 3.1)
     Ouvert en tapant un bâtiment (ou via la vue Liste). Première brique du cap « l'île =
     lobby » : le hub d'un domaine. En 3.1 il contient l'état du bâtiment + SA COLLECTION
     (obtenues avec souvenir · manquantes en silhouettes · X/Y · détail). Habitudes & quêtes
     du domaine viendront s'y greffer dans les phases suivantes. Dialog focus-trappé, Échap
     ferme (ou revient au grille depuis le détail). */
  // Jour civil « YYYY-MM-DD » → date française courte (le souvenir se lit en pied de carte).
  var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  function fmtDay(day) {
    if (typeof day !== 'string') return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
    if (!m) return day;
    return (+m[3]) + ' ' + (MOIS[(+m[2]) - 1] || '') + ' ' + m[1];
  }

  /* SILHOUETTES des objets manquants (arbitrage Leo, 4.2b) — « ombre pleine, forme devinée » :
     la carte garde son cadre et sa rareté, mais l'objet n'est qu'une masse sombre dont on
     devine le contour. Quatre formes, choisies de façon DÉTERMINISTE par l'id de l'objet :
     deux manquants voisins ne se ressemblent pas, et la même case garde toujours sa forme
     (sinon chaque re-rendu rebattrait les cartes sous les yeux). Aucune pression : c'est une
     invitation, jamais un « il te manque ». */
  var SILHOUETTES = [
    'M20 3c-3.6 0-5.8 2.6-5.8 5.6 0 2.6 1.7 3.6 1.7 5.2C10.6 16 7.4 20.8 7.4 26c0 6 4.9 11 12.6 11s12.6-5 12.6-11c0-5.2-3.2-10-8.5-12.2 0-1.6 1.7-2.6 1.7-5.2C25.8 5.6 23.6 3 20 3z',
    'M20 2 34 13 28.6 35 11.4 35 6 13z',
    'M20 38C7.6 31.4 5.2 14.6 20 2c14.8 12.6 12.4 29.4 0 36z',
    'M9 5h19a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z'
  ];
  function silhouette(id) {
    return html`
      <svg class="dmc-sil" viewBox="0 0 40 40" aria-hidden="true">
        <path d=${SILHOUETTES[cards.hash(id) % SILHOUETTES.length]} />
      </svg>`;
  }

  /* Carte de COLLECTION (4.2b) — vraie carte à collectionner (arbitrage Leo) : format portrait,
     cadre et fond teintés par la RARETÉ, glyphe en grand, nom, et le souvenir daté en pied.
     Obtenue = bouton (ouvre le détail) ; manquante = <li> inerte avec sa silhouette. */
  function cardShell(rarity, obtained) {
    return 'dm-card dm-card--' + rarity + (obtained ? ' got' : ' locked');
  }
  function CollCard(c) {
    if (!c.obtained) {
      return html`
        <li class=${cardShell(c.rarity, false)}
            aria-label=${'À découvrir — un objet ' + cards.rarityLabel(c.rarity) + ' de ce domaine, pas encore obtenu.'}>
          <span class="dmc-art">${silhouette(c.id)}</span>
          <span class="dmc-name">À découvrir</span>
          <span class="rc-rarity rc-rarity--${c.rarity} dim">${cards.rarityLabel(c.rarity)}</span>
        </li>`;
    }
    return CardButton(cards.resolve(c.id), c.entry, c.name, c.rarity);
  }
  function ExtraCard(x) { return CardButton(x.item, x.entry, x.item.name, x.item.rarity); }
  function CardButton(item, entry, name, rarity) {
    return html`
      <li class=${cardShell(rarity, true)}>
        <button class="dmc-btn" type="button"
                aria-label=${'Obtenu : ' + name + ' (' + cards.rarityLabel(rarity) + '), le ' + fmtDay(entry.day) + '. Voir le souvenir.'}
                onClick=${function () { showDetail(entry.id); }}>
          <span class="dmc-art"><span class="dmc-emoji" aria-hidden="true">${glyph(item)}</span></span>
          <span class="dmc-name">${name}</span>
          <span class="rc-rarity rc-rarity--${rarity}">${cards.rarityLabel(rarity)}</span>
          <span class="dmc-day" aria-hidden="true">${fmtDay(entry.day)}</span>
        </button>
      </li>`;
  }
  function CollectionSection(st, coll) {
    return html`
      <section class="dm-coll">
        <div class="dm-collhead">
          <h3 class="dm-h">Collection</h3>
          <span class="dm-count" aria-label=${coll.got + ' objets du catalogue obtenus sur ' + coll.total}>${coll.got}<span class="dmc-tot">/${coll.total}</span></span>
        </div>
        <p class="dm-note">Chaque objet garde le souvenir de l’action réelle qui l’a mérité.
        Les silhouettes restent à découvrir — rien ne presse.</p>
        <ul class="dm-grid">${coll.catalogue.map(CollCard)}</ul>
        ${coll.extra.length
          ? html`
            <h3 class="dm-h dm-h-extra">Et aussi · ${coll.extra.length}</h3>
            <p class="dm-note">Des trouvailles hors-catalogue (décos, jalons) que tu as méritées dans ce domaine.</p>
            <ul class="dm-grid">${coll.extra.map(ExtraCard)}</ul>`
          : null}
      </section>`;
  }

  /* ----------------------------------------------- « Agir » du domaine (Phase 3.3)
     Greffé EN HAUT du menu (arbitrage Leo : « Agir en haut, Collection en bas ») : valider
     les habitudes de CE domaine en 1 tap · lancer une quête de CE domaine (catalogue curé +
     quête perso, domaine verrouillé). Un seul chrono actif (invariant 1.4) : si une quête de
     ce domaine tourne, on montre son anneau ; si une AUTRE tourne, on l'explique doucement.
     La création d'habitude reste dans l'onglet Habitudes (arbitrage Leo). Tout est DÉRIVÉ. */
  function MenuHabit(st, hb) {
    var count = derive.habitCount(st, hb.id);
    var done = derive.isHabitValidatedOn(st, hb.id, store.todayKey());
    var next = derive.nextMilestone(count);
    return html`
      <li class="dm-habit">
        <div class="dmh-main">
          <div class="dmh-title">${hb.title}${count > 0
            ? html`<span class="dmh-count" aria-label=${'validée ' + count + ' fois'}>${count}<span class="u"> fois</span></span>`
            : null}</div>
          ${hb.freq ? html`<div class="dmh-sub">${hb.freq}</div>` : null}
          ${count >= 1 && next
            ? html`<div class="dmh-goal" aria-label=${'Plus que ' + next.remaining + ' avant le jalon des ' + next.threshold}>
                     <span aria-hidden="true">🏆</span> Plus que <strong>${next.remaining}</strong> avant le jalon des ${next.threshold}</div>`
            : null}
        </div>
        ${done
          ? html`<span class="dmh-done" role="status">Fait ✓</span>`
          : html`<button class="btn val dmh-val" type="button" aria-label=${'Valider « ' + hb.title + ' » aujourd’hui'}
                    onClick=${function () { validateHere(hb.id); }}>Je l’ai fait</button>`}
      </li>`;
  }
  function MenuQuestRow(q) {
    return html`
      <li class="quest-row">
        <div class="qr-main">
          <div class="qr-title">${q.title}<span class="qr-min">${q.minutes} min</span></div>
          <div class="qr-why">${q.why}</div>
        </div>
        <button class="btn qr-start" type="button" aria-label=${'Démarrer : ' + q.title + ', ' + q.minutes + ' minutes'}
                onClick=${function () { startQuestHere(q); }}>Démarrer</button>
      </li>`;
  }
  function MenuActiveQuest(aq) {
    var prog = derive.questProgress(aq, Date.now());
    var deg = Math.round(prog.progress * 360);
    var ringCol = prog.gateReached ? 'var(--gold)' : 'var(--accent)';
    var ringStyle = 'background: conic-gradient(' + ringCol + ' ' + deg + 'deg, var(--line) ' + deg + 'deg);';
    var d = domains.get(aq.domain);
    var gateMin = Math.max(1, Math.ceil(prog.remainingToGateMs / 60000));
    var aria = 'Quête en cours : ' + aq.title + '. Temps restant ' + fmtClock(prog.remainingToTargetMs) +
      '. ' + (prog.gateReached ? 'Tu peux valider.' : 'Encore environ ' + gateMin + ' minutes avant de pouvoir valider.');
    return html`
      <div class="active-quest" role="group" aria-label=${aria}>
        <div class="aq-head">
          <div class="qring ${prog.gateReached ? 'ready' : ''}" style=${ringStyle} aria-hidden="true">
            <div class="qring-in">
              <span class="qring-time">${fmtClock(prog.remainingToTargetMs)}</span>
              <span class="qring-unit">restant</span>
            </div>
          </div>
          <div class="aq-main">
            <div class="aq-title"><span class="h-emoji" aria-hidden="true">${d ? d.emoji : '•'}</span>${aq.title}</div>
            <div class="aq-sub">${(d ? d.label : aq.domain)} · ${aq.minutes} min estimées</div>
            <p class="aq-note">Le chrono tourne pour de vrai — même si tu fermes l’app, il reprend où il en était.</p>
          </div>
        </div>
        <div class="aq-foot">
          ${prog.gateReached
            ? html`<button class="btn gold aq-finish" type="button" onClick=${finishQuestHere}>J’ai fini</button>`
            : html`
              <div class="aq-gate">
                <button class="btn aq-finish" type="button" disabled>J’ai fini</button>
                <span class="aq-gatehint">Encore ~${gateMin} min avant de pouvoir valider — rien ne presse.</span>
              </div>`}
          ${menuConfirmAbandon
            ? null
            : html`<button class="lnk aq-abandon" type="button" onClick=${askAbandonHere}>Arrêter</button>`}
        </div>
        ${menuConfirmAbandon
          ? html`
            <div class="del-confirm" role="group" aria-label="Confirmer l’arrêt de la quête">
              <span class="msg">Arrêter cette quête ? Rien n’est perdu, tu pourras la relancer.</span>
              <button class="btn ghost" type="button" onClick=${confirmAbandonHere}>Oui, arrêter</button>
              <button class="btn" type="button" onClick=${cancelAbandonHere}>Continuer</button>
            </div>`
          : null}
      </div>`;
  }
  function MenuQuestLauncher(st, dom) {
    var list = quests.byDomain(dom.id);
    var p = menuPerso;
    return html`
      <div class="dm-qlauncher">
        ${list.length ? html`<ul class="quest-list">${list.map(MenuQuestRow)}</ul>` : null}
        <div class="perso-quest">
          <div class="pq-head">Ou lance la tienne</div>
          <input class="in" type="text" value=${p.title} placeholder="Ex. Ranger le bureau"
                 aria-label="Titre de ta quête" autocomplete="off"
                 onInput=${function (e) { menuPerso.title = e.target.value; repaint(); }} />
          <span class="lab2">Durée</span>
          <div class="dur-select" role="group" aria-label="Durée en minutes">

              var on = m === p.minutes;
              return html`
                <button type="button" class="dur-chip" aria-pressed=${on ? 'true' : 'false'}
                        onClick=${function () { menuPerso.minutes = m; repaint(); }}>${m} min</button>`;

          <p class="pq-note">Ta récompense dépendra de la durée — elle se révélera à la fin, jamais avant.</p>

        </div>
      </div>`;
  }
  function DomainActions(st, dom) {
    var habits = (st.habits || []).filter(function (hb) { return hb && hb.id && hb.domain === dom.id; });
    var aq = st.activeQuest;
    var activeValid = derive.isValidActiveQuest(aq);
    var activeHere = activeValid && aq.domain === dom.id;

      <section class="dm-act" aria-label=${'Agir dans le domaine ' + dom.label}>
        <h3 class="dm-h">Agir</h3>

          ? html`
            <div class="note-soft dm-actnote" role="status">

  // Corps « grille » du menu (Agir en haut, Collection en bas) — un seul conteneur défilant.
  function GridBody(st, dom, coll) {
    return html`
      <div class="dm-body">

      </div>`;
  }
  function DetailView(st) {
    var e = invEntry(st, detailInvId);
    if (!e) { detailInvId = null; return GridBody(st, domains.get(openDomainId)); }
    var item = cards.resolve(e.itemId);
    var d = domains.get(item.domain);
    var meta = (d ? d.label : (item.domain || '—')) + ' · ' + cards.rarityLabel(item.rarity) + ' · obtenu le ' + fmtDay(e.day);
    return html`
      <div class="dm-body dm-detail">
        <button class="dm-back" type="button" onClick=${backToGrid} aria-label="Retour à la collection">← Retour</button>
        <div class=${'dm-detail-card dm-card--' + item.rarity}>

  /* BANDEAU DU DOMAINE (4.2b, arbitrage Leo : « bandeau illustré + barre de niveau »).
     C'est lui qui fait qu'on est ENTRÉ dans un lieu : le bâtiment RÉEL du domaine (même
     dessin que sur la scène, à son niveau réel) posé dans un bandeau ciel→terre, son niveau,
     et la barre de progression vers le palier suivant. Tout est DÉRIVÉ (buildingInfo /
     domainCollection) — le bandeau ne stocke ni ne calcule rien de neuf. */
  function DomainHero(dom, info, coll) {
    var built = info.level >= 1;
    var base = derive.levelThreshold(info.level);
    var span = info.nextAt - base;
    var pct = (built && span > 0) ? Math.max(0, Math.min(100, Math.round(((info.elan - base) / span) * 100))) : 0;
    var barAria = built
      ? ('Progression vers le niveau ' + (info.level + 1) + ' : ' + pct + ' pour cent — plus que ' + info.remaining + ' d’élan.')
      : 'Fondation en sommeil — aucune progression pour l’instant.';
    return html`
      <header class="dm-hero">
        <div class="dm-heroband">
          ${heroArt({ domain: dom, level: info.level })}
          <button class="dm-close" type="button" aria-label="Fermer" onClick=${closeDomain}>✕</button>
        </div>
        <div class="dm-heroinfo">
          <div class="dm-titleline">
            <h2 class="dm-title">${dom.label}</h2>
            ${built
              ? html`<span class="dm-lv">Niveau ${info.level}</span>`
              : html`<span class="dm-lv dormant">En sommeil</span>`}
          </div>
          <div class="dm-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
               aria-valuenow=${pct} aria-label=${barAria}>
            <i style=${'width:' + pct + '%'}></i>
          </div>
          <p class="dm-state">${built
            ? html`<strong>${info.elan}</strong> d’élan · plus que <strong>${info.remaining}</strong> avant le niveau ${info.level + 1}`
            : 'Fondation en ruines — ta première action de ce domaine la relèvera.'}</p>
          <p class="dm-state dm-stat2"><strong>${coll.got}/${coll.total}</strong> objets de collection réunis</p>
        </div>
      </header>`;
  }

  function DomainMenu() {
    var st = store.get();
    var dom = domains.get(openDomainId);
    if (!dom) return null;
    var info = derive.buildingInfo(st, openDomainId);
    var coll = domainCollection(st, dom.id);
    return html`
      <div class="dom-menu" role="dialog" aria-modal="true" aria-label=${'Domaine ' + dom.label}
           onKeyDown=${function (e) {
             if (e.key === 'Escape') { if (detailInvId) backToGrid(); else closeDomain(); return; }
             trapTab(e);
           }}>
        <div class="dm-backdrop" onClick=${closeDomain} aria-hidden="true"></div>
        <div class="dm-panel" tabindex="-1" ref=${focusPanel}>
          ${DomainHero(dom, info, coll)}
          ${detailInvId ? DetailView(st) : GridBody(st, dom, coll)}
        </div>
      </div>`;
  }

  /* ------------------------------------------------------- hub des coffres (Phase 3.2)
     Ouvert en tapant le PONTON (ou via la vue Liste). Deuxième brique du cap « l'île =
     lobby » : la pile de coffres « À découvrir » vit désormais sur l'île. « Ouvrir » lance
     la cérémonie 1.3 (ctx.onOpenChest, RÉUTILISÉE) qui s'affiche par-dessus la scène ;
     l'objet rejoint alors sa collection (menu du domaine). Dialog focus-trappé, Échap ferme.
     Depuis la brique (b), c'est le SEUL accès aux coffres : la pile jumelle de M1 est partie
     (plus de doublon), seule la cérémonie reste partagée à la racine de l'App. */
  function HubChestCard(c) {
    var t = chestTypes.get(c.type);
    var typeLabel = t ? t.label : 'Coffre';
    return html`
      <li class="chest">
        <span class="chest-vig chest-vig--${c.type}" aria-hidden="true"></span>
        <div class="chest-main">
          <div class="chest-title">${typeLabel}</div>
          <div class="chest-src">${c.sourceLabel}</div>
        </div>
        <button class="btn gold chest-open" type="button"
                aria-label=${'Ouvrir : ' + typeLabel}
                onClick=${function () { onOpenChest(c.id); }}>Ouvrir</button>
      </li>`;
  }
  function ChestHub() {
    var st = store.get();
    var list = chestList(st).slice().reverse();     // plus récents en haut (comme la pile M1)
    var n = list.length;
    var stateLine = n
      ? (n + ' coffre' + (n > 1 ? 's' : '') + ' accosté' + (n > 1 ? 's' : '') + ' — rien ne presse')
      : 'Le ponton est calme pour l’instant';
    return html`
      <div class="dom-menu chest-hub" role="dialog" aria-modal="true" aria-label="Ponton des coffres — À découvrir"
           onKeyDown=${function (e) { if (e.key === 'Escape') { closeChestHub(); return; } trapTab(e); }}>
        <div class="dm-backdrop" onClick=${closeChestHub} aria-hidden="true"></div>
        <div class="dm-panel" tabindex="-1" ref=${focusPanel}>
          <header class="dm-head">
            <span class="dm-emoji" aria-hidden="true">🛶</span>
            <div class="dm-headmain">
              <h2 class="dm-title">À découvrir</h2>
              <p class="dm-state">${stateLine}</p>
            </div>
            <button class="dm-close" type="button" aria-label="Fermer" onClick=${closeChestHub}>✕</button>
          </header>
          <div class="dm-body">
            ${n
              ? html`
                <p class="dm-note">Tes coffres accostent ici — chacun garde le souvenir de ce que tu as
                accompli. Ouvre-les à ton rythme ; l’objet rejoindra la collection de son domaine.</p>
                <ul class="chest-list">${list.map(HubChestCard)}</ul>`
              : html`<p class="empty-soft big">Aucun coffre en attente. Accomplis une action — habitude, quête,
                jalon — et un coffre viendra accoster au ponton.</p>`}
          </div>
        </div>
      </div>`;
  }

  /* --------------------------------------------------------------------- écran complet */
  function Screen(ctx) {
    repaint = (ctx && typeof ctx.repaint === 'function') ? ctx.repaint : function () {};
    onOpenChest = (ctx && typeof ctx.onOpenChest === 'function') ? ctx.onOpenChest : function () {};
    var view = ctx.view === 'liste' ? 'liste' : 'scene';
    return html`
      <main class="island-screen">
        <header class="island-top">
          <div class="eyebrow">ASCEND · v${ctx.ver} · Ton île</div>
          <div class="seg" role="group" aria-label="Affichage de l’île">
            <button type="button" class="seg-btn" aria-pressed=${view === 'scene' ? 'true' : 'false'}
                    onClick=${function () { ctx.onView('scene'); }}>Scène</button>
            <button type="button" class="seg-btn" aria-pressed=${view === 'liste' ? 'true' : 'false'}
                    onClick=${function () { ctx.onView('liste'); }}>Liste</button>
          </div>
        </header>
        ${view === 'scene' ? Scene() : List()}
        ${openDomainId ? DomainMenu() : null}
        ${chestHubOpen ? ChestHub() : null}
      </main>`;
  }

  window.AscendIsland = { Screen: Screen };
})();

/* ASCEND v2 — Racine de l'app.
   Phase 1.1 : PREMIER VRAI ÉCRAN — Habitudes (créer, lister, éditer, supprimer,
   valider le jour). Remplace la page de spécimens 0.3 (les styles restent la banque
   du design system). L'ambiance suit désormais l'heure automatiquement (ambiance.js).

   État d'UI éphémère (formulaires, édition, confirmation) = variables de module,
   JAMAIS persistées (le store ne voit que les mutations métier via AscendActions).
   Re-rendu : abonnement au store (mutations) + paint() explicite (frappe clavier). */
(function () {
  'use strict';
  var h = window.preact.h;
  var render = window.preact.render;
  var html = window.htm.bind(h);
  var store = window.AscendStore;
  var actions = window.AscendActions;
  var derive = window.AscendDerive;
  var domains = window.AscendDomains;
  var chestTypes = window.AscendChests;
  var cards = window.AscendCards;
  var quests = window.AscendQuests;
  var island = window.AscendIsland;
  var VER = '0.18';

  var DURATION_PRESETS = [5, 10, 15, 20, 30, 45, 60, 90]; // minutes proposées (perso) — GDD §13.

  /* ------------------------------------------------------------ état d'UI éphémère */
  var ui = {
    tab: 'habitudes',           // 'habitudes' | 'ile' — onglet courant (jamais persisté)
    islandView: 'scene',        // 'scene' | 'liste' — bascule de la scène île (Phase 2.1)
    form: { title: '', domain: domains.list[0].id, freq: '' },
    editingId: null,
    edit: { title: '', domain: '', freq: '' },
    confirmDeleteId: null,
    milestoneDone: null,      // { threshold, chestLabel } — bandeau doux après un jalon franchi
    levelDone: null,          // { level, domainLabel, count } — bandeau doux après une montée de niveau (Phase 2.2)
    ceremony: null,           // { phase:'suspense'|'reveal', chestType, item, sourceLabel } | null
    quest: {
      domain: domains.list[0].id,                                   // filtre du catalogue
      perso: { title: '', domain: domains.list[0].id, minutes: 20 },// quête personnalisée
      confirmAbandon: false,
      done: null              // { label } — bandeau doux après un accomplissement (guide vers la pile)
    }
  };
  function resetForm() { ui.form = { title: '', domain: domains.list[0].id, freq: '' }; }
  function resetPerso() { ui.quest.perso = { title: '', domain: domains.list[0].id, minutes: 20 }; }

  // Chrono d'affichage : tant qu'une quête VALIDE tourne, on repeint chaque seconde pour
  // faire descendre le compte à rebours (aucune écriture — juste un paint dérivé de Date.now()).
  var questTick = null;
  function syncQuestTick() {
    var active = derive.isValidActiveQuest(store.get().activeQuest);
    if (active && !questTick) { questTick = setInterval(paint, 1000); }
    else if (!active && questTick) { clearInterval(questTick); questTick = null; }
  }
  // mm:ss d'une durée en ms (arrondi au plafond → le rebours n'affiche 0:00 qu'une fois écoulé).
  function fmtClock(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60);
    return m + ':' + ('0' + (s % 60)).slice(-2);
  }

  var ceremonyTimer = null;
  // Respecte le réglage système : reduce-motion → cérémonie INSTANTANÉE (pas de suspense).
  function prefersReduced() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  }

  /* ------------------------------------------------------------------- handlers */
  function onCreateSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    var created = actions.createHabit(ui.form.title, ui.form.domain, ui.form.freq);
    if (created) resetForm();
    paint();
  }
  // Valider une habitude. Si la validation FRANCHIT un jalon (Phase 1.5), on lève le bandeau
  // doux qui guide vers la pile (le coffre de jalon y attend, à côté du Coffre de bois).
  function validate(id) {
    var res = actions.validateHabit(id);
    if (res && res.ok && res.milestone) {
      var t = chestTypes.get(res.milestone.tier);
      ui.milestoneDone = { threshold: res.milestone.threshold, chestLabel: t ? t.label : 'un coffre' };
    }
    noteLevelUps(res);                                  // Phase 2.2 : bandeau doux si un niveau est franchi
    paint();                                            // store.set a déjà notifié ; ce paint pose le bandeau
  }

  // Pose le bandeau doux « montée de niveau » (Phase 2.2) à partir du résultat d'une action.
  // Célébration SOBRE (arbitrage Leo) : on cite le niveau le plus haut atteint et le nombre de
  // Coffres de cristal accostés au ponton de l'île. Non bloquant, dismissible, jamais punitif.
  function noteLevelUps(res) {
    if (!res || !res.ok || !res.levelUps || !res.levelUps.length) return;
    var top = res.levelUps[res.levelUps.length - 1];    // le niveau le plus élevé franchi
    var d = domains.get(top.domain);
    ui.levelDone = { level: top.level, domainLabel: d ? d.label : top.domain, count: res.levelUps.length };
  }

  /* --- ouverture de coffre : la cérémonie (Phase 1.3) --- */
  // On MUTE d'abord (openChest fige le tirage en inventory) puis on JOUE la présentation :
  // ainsi la récompense est en sûreté même si l'utilisateur ferme au milieu. Suspense doux
  // (~1,5 s) → révélation ; skippable ; instantané en reduce-motion.
  function openChest(chestId) {
    var res = actions.openChest(chestId);
    if (!res || !res.ok) { paint(); return; }       // introuvable (déjà ouvert) → no-op propre
    if (ceremonyTimer) { clearTimeout(ceremonyTimer); ceremonyTimer = null; }
    var reduce = prefersReduced();
    ui.ceremony = {
      phase: reduce ? 'reveal' : 'suspense',
      chestType: res.chestType, item: res.item, sourceLabel: res.sourceLabel
    };
    paint();
    if (!reduce) {
      ceremonyTimer = setTimeout(function () {
        if (ui.ceremony && ui.ceremony.phase === 'suspense') { ui.ceremony.phase = 'reveal'; paint(); }
        ceremonyTimer = null;
      }, 1500);
    }
  }
  function skipCeremony() {
    if (ceremonyTimer) { clearTimeout(ceremonyTimer); ceremonyTimer = null; }
    if (ui.ceremony && ui.ceremony.phase === 'suspense') { ui.ceremony.phase = 'reveal'; paint(); }
  }
  function closeCeremony() {
    if (ceremonyTimer) { clearTimeout(ceremonyTimer); ceremonyTimer = null; }
    ui.ceremony = null; paint();
  }

  /* --- quêtes minutées (Phase 1.4) --- */
  function startCatalogueQuest(q) {
    actions.startQuest({ questId: q.id, title: q.title, domain: q.domain, minutes: q.minutes });
    ui.quest.done = null; ui.quest.confirmAbandon = false;
    paint();
  }
  function startPersoQuest() {
    var p = ui.quest.perso;
    var res = actions.startQuest({ questId: null, title: p.title, domain: p.domain, minutes: p.minutes });
    if (res && res.ok) { resetPerso(); ui.quest.done = null; ui.quest.confirmAbandon = false; }
    paint();
  }
  function finishActiveQuest() {
    var res = actions.finishQuest();
    if (res && res.ok) {
      var t = chestTypes.get(res.tier);
      ui.quest.done = { label: t ? t.label : 'un coffre' };
      ui.quest.confirmAbandon = false;
      noteLevelUps(res);                                // Phase 2.2 : bandeau doux si un niveau est franchi
    }
    paint();
  }
  function askAbandon() { ui.quest.confirmAbandon = true; paint(); }
  function cancelAbandon() { ui.quest.confirmAbandon = false; paint(); }
  function confirmAbandon() { actions.abandonQuest(); ui.quest.confirmAbandon = false; paint(); }

  function startEdit(hb) {
    ui.editingId = hb.id;
    ui.edit = { title: hb.title, domain: hb.domain, freq: hb.freq || '' };
    ui.confirmDeleteId = null;
    paint();
  }
  function saveEdit(id) {
    if (actions.editHabit(id, { title: ui.edit.title, domain: ui.edit.domain, freq: ui.edit.freq })) {
      ui.editingId = null;
    }
    paint();
  }
  function cancelEdit() { ui.editingId = null; paint(); }

  function askDelete(id) { ui.confirmDeleteId = id; paint(); }
  function cancelDelete() { ui.confirmDeleteId = null; paint(); }
  function confirmDelete(id) { ui.confirmDeleteId = null; actions.deleteHabit(id); paint(); }

  /* --------------------------------------------------------------- composants */
  function DomainChips(selectedId, onPick) {
    return html`
      <div class="dom-select" role="group" aria-label="Domaine">
        ${domains.list.map(function (d) {
          var on = d.id === selectedId;
          return html`
            <button type="button" class="dom-chip" aria-pressed=${on ? 'true' : 'false'}
                    onClick=${function () { onPick(d.id); }}>
              <span class="d-emoji" aria-hidden="true">${d.emoji}</span>${d.label}
            </button>`;
        })}
      </div>`;
  }

  function Creator() {
    return html`
      <form class="creator" onSubmit=${onCreateSubmit}>
        <label class="lab" for="new-habit">Nouvelle habitude</label>
        <input id="new-habit" class="in" type="text" value=${ui.form.title}
               placeholder="Ex. Lire 10 pages" aria-label="Titre de la nouvelle habitude"
               autocomplete="off"
               onInput=${function (e) { ui.form.title = e.target.value; paint(); }} />
        <span class="lab2">Domaine</span>
        ${DomainChips(ui.form.domain, function (id) { ui.form.domain = id; paint(); })}
        <input class="in" type="text" value=${ui.form.freq}
               placeholder="À quel rythme ? Ex. chaque jour, 3×/semaine, quand je peux"
               aria-label="Fréquence, libre et facultative" autocomplete="off"
               onInput=${function (e) { ui.form.freq = e.target.value; paint(); }} />
        <button class="btn" type="submit" disabled=${!ui.form.title.trim()}>Ajouter l’habitude</button>
      </form>`;
  }

  function EditCard(hb) {
    return html`
      <div class="habit editing">
        <label class="lab">Titre</label>
        <input class="in" type="text" value=${ui.edit.title} aria-label="Titre" autocomplete="off"
               onInput=${function (e) { ui.edit.title = e.target.value; paint(); }} />
        <span class="lab2">Domaine</span>
        ${DomainChips(ui.edit.domain, function (id) { ui.edit.domain = id; paint(); })}
        <label class="lab" style="margin-top:14px">Fréquence</label>
        <input class="in" type="text" value=${ui.edit.freq} placeholder="Ex. chaque jour"
               aria-label="Fréquence, libre et facultative" autocomplete="off"
               onInput=${function (e) { ui.edit.freq = e.target.value; paint(); }} />
        <div class="edit-actions">
          <button class="btn" type="button" disabled=${!ui.edit.title.trim()}
                  onClick=${function () { saveEdit(hb.id); }}>Enregistrer</button>
          <button class="btn ghost" type="button" onClick=${cancelEdit}>Annuler</button>
        </div>
      </div>`;
  }

  function HabitCard(hb) {
    if (ui.editingId === hb.id) return EditCard(hb);
    var st = store.get();
    var count = derive.habitCount(st, hb.id);
    var done = derive.isHabitValidatedOn(st, hb.id, store.todayKey());
    var next = derive.nextMilestone(count);            // prochain jalon (invitation, non punitif)
    var d = domains.get(hb.domain);
    var sub = (d ? d.label : hb.domain) + (hb.freq ? ' · ' + hb.freq : '');
    return html`
      <div class="habit">
        <div class="habit-head">
          <span class="h-emoji" aria-hidden="true">${d ? d.emoji : '•'}</span>
          <div class="h-main">
            <div class="h-title">${hb.title}</div>
            <div class="h-sub">${sub}</div>
          </div>
          ${count > 0
            ? html`<span class="h-count" aria-label=${'validée ' + count + ' fois'}>
                     ${count}<span class="u">fois</span></span>`
            : null}
        </div>
        ${count >= 1 && next
          ? html`<div class="h-goal" aria-label=${'Plus que ' + next.remaining + ' avant le jalon des ' + next.threshold}>
                   <span class="hg-ico" aria-hidden="true">🏆</span>
                   <span>Plus que <strong>${next.remaining}</strong> avant le jalon des ${next.threshold}</span>
                 </div>`
          : null}
        <div class="habit-foot">
          ${done
            ? html`<span class="done" role="status">Fait ✓</span>`
            : html`<button class="btn val" type="button"
                     onClick=${function () { validate(hb.id); }}>Je l’ai fait</button>`}
          <div class="h-actions">
            <button class="lnk" type="button" onClick=${function () { startEdit(hb); }}
                    aria-label=${'Modifier ' + hb.title}>Modifier</button>
            <button class="lnk" type="button" onClick=${function () { askDelete(hb.id); }}
                    aria-label=${'Supprimer ' + hb.title}>Supprimer</button>
          </div>
        </div>
        ${ui.confirmDeleteId === hb.id
          ? html`
            <div class="del-confirm" role="group" aria-label="Confirmer la suppression">
              <span class="msg">Supprimer « ${hb.title} » ?</span>
              <button class="btn" type="button"
                      onClick=${function () { confirmDelete(hb.id); }}>Oui, supprimer</button>
              <button class="btn ghost" type="button" onClick=${cancelDelete}>Annuler</button>
            </div>`
          : null}
      </div>`;
  }

  // Bandeau doux après un JALON franchi (Phase 1.5) — même grammaire que « quête accomplie » :
  // célèbre le cap, guide vers le PONTON de l'île (brique lobby (b) : les coffres n'ont plus de
  // pile ici, ils accostent au ponton), dismissible, jamais culpabilisant.
  function MilestoneBanner() {
    var m = ui.milestoneDone;
    if (!m) return null;
    return html`
      <div class="note-soft" role="status">
        <span>✨ Jalon des <strong>${m.threshold}</strong> franchi — ton <strong>${m.chestLabel}</strong>${' '}
        vient d’accoster au ponton de ton île.</span>
        <button class="lnk" type="button"
                onClick=${function () { ui.milestoneDone = null; paint(); }}>OK</button>
      </div>`;
  }

  // Bandeau doux après une MONTÉE DE NIVEAU (Phase 2.2) — même grammaire que jalon/quête :
  // célèbre le cap du bâtiment, guide vers le PONTON de l'île où accoste le Coffre de
  // cristal, dismissible, jamais culpabilisant. Célébration SOBRE (arbitrage Leo).
  function LevelBanner() {
    var m = ui.levelDone;
    if (!m) return null;
    var plural = m.count > 1;
    return html`
      <div class="note-soft" role="status">
        <span>🏛️ Ton <strong>${m.domainLabel}</strong> atteint le <strong>niveau ${m.level}</strong> —
        ${plural ? 'des Coffres de cristal ont accosté' : 'un Coffre de cristal a accosté'} au ponton de ton île.</span>
        <button class="lnk" type="button"
                onClick=${function () { ui.levelDone = null; paint(); }}>OK</button>
      </div>`;
  }

  function EmptyState() {
    return html`
      <div class="empty">
        <div class="e-emoji" aria-hidden="true">🌱</div>
        <div class="e-title">Ton île attend sa première graine</div>
        <p>Crée une habitude que tu veux faire souvent — elle réveillera ton île.</p>
      </div>`;
  }

  /* ------------------------------------------------ carte-récompense (placeholder) */
  // Placeholder géométrique propre (les SVG Claude Design la remplaceront, jamais
  // redessinés). En 1.3 seule la rareté « commun » est produite → seule elle est stylée.
  function RewardCard(item) {
    var d = domains.get(item.domain);
    return html`
      <div class="reward-card">
        <span class="rc-emoji" aria-hidden="true">${d ? d.emoji : '✨'}</span>
        <div class="rc-name">${item.name}</div>
        <span class="rc-rarity rc-rarity--${item.rarity}">${cards.rarityLabel(item.rarity)}</span>
      </div>`;
  }

  // La cérémonie (< 6 s, skippable, instantanée en reduce-motion) : suspense doux →
  // révélation « Tu as obtenu … » → la carte rejoint la collection (bouton doré).
  function Ceremony() {
    var c = ui.ceremony;
    if (!c) return null;
    var suspense = c.phase === 'suspense';
    return html`
      <div class="ceremony" role="dialog" aria-modal="true" aria-label="Ouverture d’un coffre"
           onClick=${suspense ? skipCeremony : null}>
        ${suspense
          ? html`
            <div class="cer-stage">
              <span class="cer-chest chest-vig chest-vig--${c.chestType}" aria-hidden="true"></span>
              <p class="cer-hint">Ouverture…
                <button class="cer-skip" type="button"
                        onClick=${function (e) { if (e && e.stopPropagation) e.stopPropagation(); skipCeremony(); }}>Passer</button>
              </p>
            </div>`
          : html`
            <div class="cer-stage cer-reveal" role="status">
              <p class="cer-kicker">Tu as obtenu</p>
              ${RewardCard(c.item)}
              <p class="cer-src">${c.sourceLabel}</p>
              <button class="btn gold" type="button" onClick=${closeCeremony}>Rejoindre ma collection</button>
            </div>`}
      </div>`;
  }

  /* ------------------------------------------------ quêtes minutées (Phase 1.4) */
  // Carte de la quête EN COURS : anneau de progression + compte à rebours (arbitrage Leo).
  // L'anneau se remplit vers la durée CIBLE et passe au DORÉ à 50 % (gate débloqué). Le
  // bouton « J'ai fini » reste grisé avant 50 % avec « encore ~X min » (non punitif) ; abandon
  // possible à tout moment, sans rien retirer. Le chrono est RÉEL (repris après reload).
  function ActiveQuestCard(aq) {
    var prog = derive.questProgress(aq, Date.now());
    var deg = Math.round(prog.progress * 360);
    var ringCol = prog.gateReached ? 'var(--gold)' : 'var(--accent)';
    var ringStyle = 'background: conic-gradient(' + ringCol + ' ' + deg + 'deg, var(--line) ' + deg + 'deg);';
    var d = domains.get(aq.domain);
    var gateMin = Math.max(1, Math.ceil(prog.remainingToGateMs / 60000));
    var aria = 'Quête en cours : ' + aq.title + '. Temps restant ' + fmtClock(prog.remainingToTargetMs) +
      '. ' + (prog.gateReached ? 'Tu peux valider.' : 'Encore environ ' + gateMin + ' minutes avant de pouvoir valider.');
    return html`
      <div class="active-quest" role="group" aria-label=${aria}>
        <div class="aq-head">
          <div class="qring ${prog.gateReached ? 'ready' : ''}" style=${ringStyle} aria-hidden="true">
            <div class="qring-in">
              <span class="qring-time">${fmtClock(prog.remainingToTargetMs)}</span>
              <span class="qring-unit">restant</span>
            </div>
          </div>
          <div class="aq-main">
            <div class="aq-title"><span class="h-emoji" aria-hidden="true">${d ? d.emoji : '•'}</span>${aq.title}</div>
            <div class="aq-sub">${(d ? d.label : aq.domain)} · ${aq.minutes} min estimées</div>
            <p class="aq-note">Le chrono tourne pour de vrai — même si tu fermes l’app, il reprend où il en était.</p>
          </div>
        </div>
        <div class="aq-foot">
          ${prog.gateReached
            ? html`<button class="btn gold aq-finish" type="button" onClick=${finishActiveQuest}>J’ai fini</button>`
            : html`
              <div class="aq-gate">
                <button class="btn aq-finish" type="button" disabled>J’ai fini</button>
                <span class="aq-gatehint">Encore ~${gateMin} min avant de pouvoir valider — rien ne presse.</span>
              </div>`}
          ${ui.quest.confirmAbandon
            ? null
            : html`<button class="lnk aq-abandon" type="button" onClick=${askAbandon}>Arrêter</button>`}
        </div>
        ${ui.quest.confirmAbandon
          ? html`
            <div class="del-confirm" role="group" aria-label="Confirmer l’arrêt de la quête">
              <span class="msg">Arrêter cette quête ? Rien n’est perdu, tu pourras la relancer.</span>
              <button class="btn ghost" type="button" onClick=${confirmAbandon}>Oui, arrêter</button>
              <button class="btn" type="button" onClick=${cancelAbandon}>Continuer</button>
            </div>`
          : null}
      </div>`;
  }

  // Une ligne du catalogue curé : titre + durée + « pourquoi » + démarrer.
  function QuestRow(q) {
    return html`
      <li class="quest-row">
        <div class="qr-main">
          <div class="qr-title">${q.title}<span class="qr-min">${q.minutes} min</span></div>
          <div class="qr-why">${q.why}</div>
        </div>
        <button class="btn qr-start" type="button" aria-label=${'Démarrer : ' + q.title + ', ' + q.minutes + ' minutes'}
                onClick=${function () { startCatalogueQuest(q); }}>Démarrer</button>
      </li>`;
  }

  // Le lanceur de quêtes (visible quand AUCUNE quête ne tourne) : catalogue filtré par domaine
  // + création d'une quête perso (récompense JAMAIS saisie — dérivée de la durée à la fin).
  function QuestLauncher() {
    var list = quests.byDomain(ui.quest.domain);
    var p = ui.quest.perso;
    return html`
      <div class="quest-launcher">
        <span class="lab2" style="margin-top:0">Choisis un domaine</span>
        ${DomainChips(ui.quest.domain, function (id) { ui.quest.domain = id; paint(); })}
        <ul class="quest-list">${list.map(QuestRow)}</ul>

        <div class="perso-quest">
          <div class="pq-head">Ou lance la tienne</div>
          <input class="in" type="text" value=${p.title} placeholder="Ex. Ranger le bureau"
                 aria-label="Titre de ta quête" autocomplete="off"
                 onInput=${function (e) { ui.quest.perso.title = e.target.value; paint(); }} />
          <span class="lab2">Domaine</span>
          ${DomainChips(p.domain, function (id) { ui.quest.perso.domain = id; paint(); })}
          <span class="lab2">Durée</span>
          <div class="dur-select" role="group" aria-label="Durée en minutes">
            ${DURATION_PRESETS.map(function (m) {
              var on = m === p.minutes;
              return html`
                <button type="button" class="dur-chip" aria-pressed=${on ? 'true' : 'false'}
                        onClick=${function () { ui.quest.perso.minutes = m; paint(); }}>${m} min</button>`;
            })}
          </div>
          <p class="pq-note">Ta récompense dépendra de la durée — elle se révélera à la fin, jamais avant.</p>
          <button class="btn" type="button" disabled=${!p.title.trim()}
                  onClick=${startPersoQuest}>Démarrer cette quête</button>
        </div>
      </div>`;
  }

  // Section Quêtes : soit la quête en cours (un seul chrono), soit le lanceur. Un bandeau doux
  // guide vers le PONTON de l'île juste après un accomplissement.
  function QuestSection() {
    var aq = store.get().activeQuest;
    var active = derive.isValidActiveQuest(aq);
    return html`
      <section class="section quest-section" aria-label="Quêtes minutées">
        <h2 class="sec-title">Quêtes minutées</h2>
        <p class="sec-note">Une action, un chrono honnête. À la moitié du temps, tu peux valider —
        et tu reçois un coffre à la hauteur de l’effort.</p>
        ${ui.quest.done
          ? html`
            <div class="note-soft" role="status">
              <span>Quête accomplie 🎉 — ton <strong>${ui.quest.done.label}</strong> vient d’accoster au ponton de ton île.</span>
              <button class="lnk" type="button" onClick=${function () { ui.quest.done = null; paint(); }}>OK</button>
            </div>`
          : null}
        ${active ? ActiveQuestCard(aq) : QuestLauncher()}
      </section>`;
  }

  // Écran M1 (habitudes / quêtes) — un onglet. Brique lobby (b) : la pile de coffres « À
  // découvrir » a QUITTÉ cet écran (les coffres accostent au ponton de l'île, Phase 3.2) ;
  // seule la cérémonie 1.3 reste montée à la racine de l'App, partagée avec l'île.
  function HabitScreen() {
    var habits = (store.get().habits || []).filter(function (hb) { return hb && hb.id; });
    return html`
      <main class="wrap">
        <header class="app-hero">
          <div class="eyebrow">ASCEND · v${VER}</div>
          <h1>Tes habitudes</h1>
          <p class="lede">Chaque fois que tu la fais pour de vrai, valide-la ici.
          Rien ne se perd, rien ne se punit — ton île avance avec toi.</p>
        </header>

        ${Creator()}

        <section class="section" aria-label="Tes habitudes">
          ${LevelBanner()}
          ${MilestoneBanner()}
          ${habits.length
            ? html`<div class="habits">${habits.map(HabitCard)}</div>`
            : EmptyState()}
        </section>

        ${QuestSection()}
      </main>`;
  }

  // Barre d'onglets (bas) : bascule Île ↔ Habitudes. Fixe, sûre pour l'encoche (safe-area).
  function TabBar() {
    var tabs = [
      { id: 'ile', label: 'Île', emoji: '🏝️' },
      { id: 'habitudes', label: 'Habitudes', emoji: '🌱' }
    ];
    return html`
      <nav class="tabbar" role="tablist" aria-label="Navigation principale">
        ${tabs.map(function (t) {
          var on = ui.tab === t.id;
          return html`
            <button type="button" class="tab ${on ? 'on' : ''}" role="tab"
                    aria-selected=${on ? 'true' : 'false'}
                    onClick=${function () { if (ui.tab !== t.id) { ui.tab = t.id; paint(); } }}>
              <span class="tab-emoji" aria-hidden="true">${t.emoji}</span>
              <span class="tab-label">${t.label}</span>
            </button>`;
        })}
      </nav>`;
  }

  function App() {
    var onIsland = ui.tab === 'ile';
    return html`
      <div class="sky" aria-hidden="true"></div>
      ${onIsland
        ? island.Screen({
            view: ui.islandView, ver: VER,
            onView: function (v) { if (ui.islandView !== v) { ui.islandView = v; paint(); } },
            repaint: paint,     // Phase 2.3 : re-rendu pour l'UI de placement éphémère (sélection, glisser)
            onOpenChest: openChest  // Phase 3.2 : le hub des coffres (ponton) lance la cérémonie 1.3
          })
        : HabitScreen()}
      ${TabBar()}
      ${Ceremony()}`;
  }

  /* ------------------------------------------------------------------- montage */
  var mount = document.getElementById('app');
  function paint() { render(h(App), mount); syncQuestTick(); }
  store.subscribe(function () { paint(); });
  paint();
  var splash = document.getElementById('splash');
  if (splash) splash.classList.add('hidden');
})();

</script>
</body>
</html>
